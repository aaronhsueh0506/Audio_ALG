; ============================================================
; DeepFilterNet-AENR training config
;
; Usage: python3 train.py --config config.ini   (see train.py's top-of-file
; docstring for the full CLI and for how to render/pack the dataset this
; file points at).
; ============================================================

[signal]
; MUST match the [signal] section the packed corpus below was rendered with
; (AIAEC/dataset_gen/config.ini). 48 kHz uses 1024/1024/512 with df_bins=96;
; 16 kHz uses 512/512/256 with df_bins=64 -- both are model.py defaults,
; nothing to set here beyond the grid itself.
sr = 48000
n_fft = 1024
; win_len = 1024
; hop_len = 512

[data]
; Output of (--output is 48 kHz-specific -- the 16 kHz trainers write their
; own generation into data_aec_16k/, and the two MUST NOT share a directory:
; whichever sample rate was generated last would silently overwrite the
; other's seqs/packed content):
;   python3 -m AIAEC.dataset_gen.gen_aec_dataset --config ... --split all --hours 100 --output data_aec_48k
;   python3 -m AIAEC.dataset_gen.pack_aec_dataset --input data_aec_48k/all --output data_aec_48k/packed/all
; ONE unified pool. Training applies a deterministic random per-chunk split;
; evaluate source generalisation on a separate held-out corpus.
packed_dir = data_aec_48k/packed/all
; Ordinary shuffled model batches. PBFDKF has already been materialized as
; the dataset's last channel and is never rerun by the trainer.
batch_size = 8
num_workers = 4
; Held out at LOAD time by deterministic per-chunk random split.
; 0 = no validation pass (not recommended -- early stopping and *_best.pth
; both need one).
val_fraction = 0.1

; ============================================================
; DFN feature normalisation. These are the SAME keys and the SAME tuned
; values as AINR/DeepFilterNet2/config.ini's own [feature] section, because
; this candidate calls extract_dfn2_features() verbatim (see train.py's
; top-of-file note). Do not "recalibrate" these independently for the AEC
; corpus -- AINR/DeepFilterNet2/UPSTREAM_ALIGNMENT.md documents at length why
; the naive corpus-fitted numbers trained WORSE than these, for reasons that
; are still open; changing them here without re-reading that document
; reproduces a regression this repo has already paid to find once.
; ============================================================
[feature]
erb_norm_tau_sec = 1.0
erb_norm_init_lo_db = -60.0
erb_norm_init_hi_db = -90.0
erb_norm_scale_db = 40.0
spec_norm_tau_sec = 1.0
spec_norm_init_lo = 0.001
spec_norm_init_hi = 0.0001

[model]
; Every key here is a keyword argument of DeepFilterNetAENR.__init__ OR of
; DeepFilterNet2.__init__ (forwarded via **kwargs) -- see model.py for the
; former and AINR/DeepFilterNet2/model.py for the latter; both are merged,
; and an unrecognised key still raises. n_erb / df_bins / df_order /
; mask_lookahead / df_lookahead / n_fft / sr are bound by [signal] and the
; constructor's own explicit params and are NOT settable here.
; Commented values below ARE the constructor defaults.
; enc_ch = 64
; emb_size = 256
; df_hidden = 256
; df_num_layers = 2
; emb_num_layers = 3
; lin_groups = 16
; enc_lin_groups = 32
; enc_concat = false
; mask_pf = false
; pf_beta = 0.02

[training]
output_dir = output
lr = 1e-3
weight_decay = 1e-4
amsgrad = true
max_epochs = 100
early_stop_patience = 15
grad_clip = 1.0

[loss]
; See AIAEC/training_common.py's compressed_spectral_loss: no candidate paper
; publishes a loss, so all six trainers share this one for comparability.
compression = 0.3
magnitude_weight = 1.0
complex_weight = 1.0
