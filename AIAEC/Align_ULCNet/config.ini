; ============================================================
; Align-ULCNet training config
;
; Usage: python3 train.py --config config.ini   (see train.py's top-of-file
; docstring for the full CLI and for how to render/pack the dataset this
; file points at).
; ============================================================

[signal]
; MUST match the [signal] section the packed corpus below was rendered with
; (AIAEC/dataset_gen/config.ini). Paper defaults are 16 kHz/512/512/256; this
; project also accepts 48 kHz/1024/1024/512.  At 48 kHz, max_delay_frames
; must be set explicitly: the one-second constructor fallback is 94 frames,
; above the deployed D <= 64 contract (see model.py / README.md).
sr = 16000
n_fft = 512
; win_len = 512
; hop_len = 256

[data]
; Output of (--output is sample-rate-specific: a generator run at another
; rate writes into its own data_aec_<rate>/, and the two MUST NOT share a
; directory: whichever sample rate was generated last would silently
; overwrite the other's seqs/packed content):
;   python3 -m AIAEC.dataset_gen.gen_aec_dataset --config ... --split all --hours 100 --output data_aec_16k
;   python3 -m AIAEC.dataset_gen.pack_aec_dataset --input data_aec_16k/all --output data_aec_16k/packed/all
; ONE unified pool. Training applies a deterministic random per-chunk split;
; evaluate source generalisation on a separate held-out corpus.
packed_dir = data_aec_16k/packed/all
; Ordinary shuffled model batches. PBFDKF has already been materialized as
; the dataset's last channel and is never rerun by the trainer.
; Paper uses 64.  This project uses 16 because the deployed D=32 graph must
; fit the available training GPU; batch size does not change model shape.
batch_size = 16
num_workers = 4
; Held out at LOAD time by deterministic per-chunk random split.
; 0 = no validation pass (not recommended -- early stopping and *_best.pth
; both need one).
val_fraction = 0.1

[model]
; Every key here is a keyword argument of AlignULCNet.__init__ (model.py).
; Commented values below ARE the constructor defaults.
; max_delay_seconds = 1.0
; gamma = 5
;   C-SamFR subband count parameter (Figure 2 of the paper); K_B=2, gamma=5
;   -> at 16 kHz: 130 subbands and 5 channels of 52 bins each.  The same
;   formula is re-derived for the 48 kHz grid (5 channels of 104 bins); see
;   model.py's ChannelSampledReorientation.
; subband_bins = 2
; compression_exponent = 0.3
;   Power-law compression on the input features.  The loss independently uses
;   the same exponent for component-wise signed compression.
max_delay_frames = 32
;   Training-time temporal-alignment depth D.  This explicit value overrides
;   max_delay_seconds.  This run intentionally trains D=32; a smaller product
;   D is a separate export/evaluation choice and must not be implied here.
;   The attention activation/state memory scales linearly with D, so reducing
;   the paper's D=64 default materially lowers CUDA memory use.  D also changes
;   the attention candidate set, so a resumed run must keep the checkpoint's D.

[training]
output_dir = output
; Align-ULCNet paper recipe: Adam at 4e-3; reduce LR by 10x after one
; validation epoch without improvement.  Weight decay/AMSGrad are not used.
optimizer = adam
lr = 4e-3
weight_decay = 0
amsgrad = false
scheduler = reduce_on_plateau
lr_decay_factor = 0.1
lr_patience = 1
max_epochs = 50
; Equal to max_epochs so this 50-epoch campaign is not cut short. LR plateau
; detection remains active independently through lr_patience above.
early_stop_patience = 50
grad_clip = 1.0

[loss]
; ULCNet component-wise signed power compression followed by complex MSE.
compression = 0.3
