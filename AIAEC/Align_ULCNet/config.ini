; ============================================================
; Align-ULCNet training config
;
; Usage: python3 train.py --config config.ini   (see train.py's top-of-file
; docstring for the full CLI and for how to render/pack the dataset this
; file points at).
; ============================================================

[signal]
; MUST match the [signal] section the packed corpus below was rendered with
; (AIAEC/dataset_gen/config.ini). Paper defaults are 16 kHz/512/512/256; this
; project also accepts 48 kHz/1024/1024/512.  At 48 kHz, max_delay_frames
; must be set explicitly: the one-second constructor fallback is 94 frames,
; above the deployed D <= 64 contract (see model.py / README.md).
sr = 16000
n_fft = 512
; win_len = 512
; hop_len = 256

[data]
; Output of (--output is sample-rate-specific: a generator run at another
; rate writes into its own data_aec_<rate>/, and the two MUST NOT share a
; directory: whichever sample rate was generated last would silently
; overwrite the other's seqs/packed content):
;   python3 -m AIAEC.dataset_gen.gen_aec_dataset --config ... --split all --hours 100 --output data_aec_16k
;   python3 -m AIAEC.dataset_gen.pack_aec_dataset --input data_aec_16k/all --output data_aec_16k/packed/all
; ONE unified pool. Training applies a deterministic random per-chunk split;
; evaluate source generalisation on a separate held-out corpus.
packed_dir = data_aec_16k/packed/all
; Ordinary shuffled model batches. PBFDKF has already been materialized as
; the dataset's last channel and is never rerun by the trainer.
; Paper uses 64.  This project uses 16 because the deployed D=32 graph must
; fit the available training GPU; batch size does not change model shape.
batch_size = 16
num_workers = 4
; Held out at LOAD time by deterministic per-chunk random split.
; 0 = no validation pass (not recommended -- early stopping and *_best.pth
; both need one).
val_fraction = 0.1

[model]
; Every key here is a keyword argument of AlignULCNet.__init__ (model.py).
; Commented values below ARE the constructor defaults.
; max_delay_seconds = 1.0
; gamma = 5
;   C-SamFR subband count parameter (Figure 2 of the paper); K_B=2, gamma=5
;   -> at 16 kHz: 130 subbands and 5 channels of 52 bins each.  The same
;   formula is re-derived for the 48 kHz grid (5 channels of 104 bins); see
;   model.py's ChannelSampledReorientation.
; subband_bins = 2
; compression_exponent = 0.3
;   Power-law compression on the input features.  The loss independently uses
;   the same exponent for component-wise signed compression.
max_delay_frames = 32
;   Training-time temporal-alignment depth D.  This explicit value overrides
;   max_delay_seconds.  This run intentionally trains D=32; a smaller product
;   D is a separate export/evaluation choice and must not be implied here.
;   The attention activation/state memory scales linearly with D, so reducing
;   the paper's D=64 default materially lowers CUDA memory use.  D also changes
;   the attention candidate set, so a resumed run must keep the checkpoint's D.

[training]
output_dir = output
; Optimizer: the recipe ascribed to the paper. Note that no copy of the paper
; is in this repo, so `optimizer`, `lr`, `weight_decay` and `amsgrad` are
; transcribed prose with no primary source behind them -- do not cite them as
; established. `adamw` is also accepted; at weight_decay = 0 the two are
; bit-identical (measured: 0/67 tensors differ on this model after 20 steps),
; so the name only starts to matter once weight_decay is raised. If it is,
; use `adamw`: coupled decay under `adam` is what drove subband_grus.1 to
; denormal (measured 5.66e-25 by step 1000 at wd = 1e-4).
;
; Do NOT pair this loss with amsgrad = true. Component-wise compression at
; c = 0.3 has an unbounded derivative at zero, held back only by the eps clamp
; at 0.3 * 1e-12**-0.7 = 7.54e7; measured single-bin gradients reach 936-1816
; against a batch mean of 0.23-0.87. amsgrad keeps a running MAXIMUM of the
; second moment, so one such spike permanently suppresses that parameter's
; effective LR for the rest of the run. The pre-2026-08-30 config ran
; amsgrad = true, but against a different loss; carrying that line over
; wholesale is not safe.
optimizer = adam
lr = 4e-3
weight_decay = 0
amsgrad = false
;
; Schedule: per-step linear warmup to `lr` over `warmup_epochs`, then cosine
; annealing to `min_lr`. A PROJECT choice; the recipe ascribed to the paper is
; ReduceLROnPlateau, still selectable as `reduce_on_plateau` with the
; lr_decay_factor/lr_patience pair below.
;
; The plateau schedule is not shipped because its patience is denominated in
; EPOCHS, and this project's epoch is not the paper's. The paper is credited
; with 20,000 steps per epoch; one pass over this corpus is ~2,025 steps at
; batch 16, so `lr_patience = 1` bought a tenth of the grace it was written
; for. Measured against the real scheduler: only 4 reductions separate 4e-3
; from the 1e-6 floor, and with cooldown = 0 and `best` a running minimum,
; 96.5% of 200 seeded runs reach that floor inside 50 epochs at 2% validation
; jitter, 100% at 5%; and in closed loop on this model it floored by epoch 11.
; With early stopping disabled at 50 = max_epochs, the remaining epochs then
; run at 1/4000 of the peak while the job still reports a full campaign. A
; step-indexed schedule cannot inherit the defect, because it never counts
; epochs.
;
; Warmup is not here for stability -- nothing diverges at 4e-3, and the peak LR
; is not the fault: on fresh data at corpus level, 4e-3 still reached a lower
; held-out loss than 1e-3 with warmup (0.137 vs 0.180). It is here because a
; step-indexed curve has to start somewhere, and starting at the peak is a
; choice nothing recommends. Do not look for a stronger claim than that: an
; earlier justification here cited a sigmoid-saturation trajectory that did not
; survive checking -- the oracle gate for this task is itself 67% saturated, the
; trajectory reverses on non-repeated batches, and magnitude_mask is an
; intermediate gate behind a BatchNorm rather than the mask that multiplies the
; spectrum.
scheduler = warmup_cosine
lr_warmup = 1e-4
warmup_epochs = 3
min_lr = 1e-6
; Consulted only when scheduler = reduce_on_plateau. Kept at values that
; survive noise: measured over 200 seeds at every jitter level up to 15%,
; factor 0.5 with patience 5 never reaches the floor within 50 epochs.
lr_decay_factor = 0.5
lr_patience = 5
max_epochs = 50
; Restored to a real value. At 50 (= max_epochs) early stopping is off, which
; pairs badly with any schedule that can stall: the run reports a complete
; 50-epoch campaign while the tail contributes nothing. The last run to train
; well here stopped near epoch 4x under this patience.
early_stop_patience = 15
grad_clip = 1.0

[loss]
; ULCNet component-wise signed power compression followed by complex MSE.
compression = 0.3
