; ============================================================
; Align-ULCNet training config
;
; Usage: python3 train.py --config config.ini   (see train.py's top-of-file
; docstring for the full CLI and for how to render/pack the dataset this
; file points at).
; ============================================================

[signal]
; MUST match the [signal] section the packed corpus below was rendered with
; (AIAEC/dataset_gen/config.ini). Paper defaults are 16 kHz/512/512/256; this
; project also accepts 48 kHz/1024/1024/512.  At 48 kHz, max_delay_frames
; must be set explicitly: the one-second constructor fallback is 94 frames,
; above the deployed D <= 64 contract (see model.py / README.md).
;
; 2026-11-11: board target is now hop 128 (n_fft 256), shared with DeepVQE-S. A prior run trained
; against this [signal] while dataset_gen/config.ini was still 512/256 (known mismatch, unfixed).
sr = 16000
n_fft = 256
; win_len = 256
; hop_len = 128

[data]
; Output of (--output is sample-rate-specific: a generator run at another
; rate writes into its own data_aec_<rate>/, and the two MUST NOT share a
; directory: whichever sample rate was generated last would silently
; overwrite the other's seqs/packed content):
;   python3 -m AIAEC.dataset_gen.gen_aec_dataset --config ... --split all --hours 100 --output data_aec_16k
;   python3 -m AIAEC.dataset_gen.pack_aec_dataset --input data_aec_16k/all --output data_aec_16k/packed/all
; ONE unified pool. Training applies a deterministic random per-chunk split;
; evaluate source generalisation on a separate held-out corpus.
packed_dir = data_aec_16k/packed/all
; Ordinary shuffled model batches. PBFDKF has already been materialized as
; the dataset's last channel and is never rerun by the trainer.
; Paper uses 64.  This project uses 16 because the deployed D=32 graph must
; fit the available training GPU; batch size does not change model shape.
; Sized for D=32; D=63 at this [signal]'s grid roughly doubles memory use, not re-validated here.
batch_size = 16
num_workers = 4
; Held out at LOAD time by deterministic per-chunk random split.
; 0 = no validation pass (not recommended -- early stopping and *_best.pth
; both need one).
val_fraction = 0.1

[model]
; Every key here is a keyword argument of AlignULCNet.__init__ (model.py).
; Commented values below ARE the constructor defaults.
; max_delay_seconds = 1.0
; gamma = 5
;   C-SamFR subband count parameter (Figure 2 of the paper); K_B=2, gamma=5
;   -> at 16 kHz: 130 subbands and 5 channels of 52 bins each.  The same
;   formula is re-derived for the 48 kHz grid (5 channels of 104 bins); see
;   model.py's ChannelSampledReorientation.
; subband_bins = 2
; compression_exponent = 0.3
;   Power-law compression on the input features.  [loss] compression is the
;   loss's own exponent (the same value), applied to the complex magnitude.
; 2026-11-11: switched from max_delay_frames=32 (512/256 grid) to max_delay_seconds, matching
; DeepVQE_S's convention (D=63 at this [signal]'s hop 128). A resumed run keeps the checkpoint's own D.
max_delay_seconds = 0.5

[training]
output_dir = output
; Optimizer: the published Align-ULCNet recipe (arXiv:2410.13620): Adam with
; initial lr=4e-3.  The paper does not state weight decay or AMSGrad, so both
; stay at their Adam defaults (zero/false). `adamw` is also accepted; at
; weight_decay = 0 the two are
; bit-identical (measured: 0/67 tensors differ on this model after 20 steps),
; so the name only starts to matter once weight_decay is raised. If it is,
; use `adamw`: coupled decay under `adam` is what drove subband_grus.1 to
; denormal (measured 5.66e-25 by step 1000 at wd = 1e-4).
;
; Keep amsgrad = false: it keeps a running MAXIMUM of the second moment, so one
; very large single-bin gradient permanently lowers that parameter's effective
; LR for the rest of the run. The gradient tail of the loss below has not been
; measured on real data.
optimizer = adam
lr = 4e-3
weight_decay = 0
amsgrad = false
;
; Project-wide training schedule: three local epochs of linear warmup followed
; by per-optimizer-step cosine decay through the remaining 50-epoch budget.
; The optimizer/LR/loss above stay model-specific; only the schedule is shared
; so a validation plateau cannot terminate useful learning or make two runs'
; LR trajectories depend on validation noise.
scheduler = warmup_cosine
lr_warmup = 1e-4
warmup_epochs = 3
min_lr = 1e-6
;
; Used only by an explicit reduce_on_plateau comparison.
lr_decay_factor = 0.1
lr_patience = 5
max_epochs = 50
; 0 disables early stopping.  *_best.pth still tracks validation loss, while
; the requested 50-epoch budget is allowed to finish.  A fixed patience of 15
; terminates this model at epoch 15 whenever epoch 0 happens to be the
; validation minimum; that is not evidence that gradients are absent.
early_stop_patience = 0
grad_clip = 1.0

[loss]
; PLCPA, the objective DeepVQE_S and Align_CRUSE train with (see
; training_common.power_compressed_complex_mse_loss). The Align-ULCNet paper
; states no loss; README.md has the provenance.
; A resumed run must keep the checkpoint's values of the three keys below.
compression = 0.3
; Weight on the phase-preserving complex term; 1 - complex_weight weights the
; compressed magnitude term.
complex_weight = 0.7
; Evaluate the loss on the estimate after an iSTFT->STFT round trip, the same
; projection DeepVQE_S and Align_CRUSE train through. false scores the raw
; per-frame spectrum.
; DO NOT run this on MPS. torch 2.8.0's MPS backend computes the STFT backward
; incorrectly above 65,536 samples (the shipped 10 s chunk is 160,256), and
; training_common refuses it rather than warning. Use --device cpu or CUDA, or
; set this false.
stft_consistency = true
