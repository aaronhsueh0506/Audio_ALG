; ============================================================
; Align-ULCNet training config
;
; Usage: python3 train.py --config config.ini   (see train.py's top-of-file
; docstring for the full CLI and for how to render/pack the dataset this
; file points at).
; ============================================================

[signal]
; MUST match the [signal] section the packed corpus below was rendered with
; (AIAEC/dataset_gen/config.ini). Paper defaults are 16 kHz/512/512/256; this
; project also accepts 48 kHz/1024/1024/512 (frame count re-derived from one
; physical second rather than the paper's fixed 64-frame buffer -- see
; model.py / README.md).
sr = 16000
n_fft = 512
; win_len = 512
; hop_len = 256

[data]
; Output of: python3 -m AIAEC.dataset_gen.pack_aec_dataset --input data_aec/train --output data_aec/packed/train
packed_dir = data_aec/packed/train
; batch_size IS the lane count for SequenceChunkSampler -- see
; ../GTCRN_AENR/config.ini's note; the same constraint applies here.
batch_size = 8
num_workers = 4

[val_data]
; Optional. Delete this section to train without a validation pass.
packed_dir = data_aec/packed/val

[linear_aec]
; Which frozen production linear-AEC preset feeds this candidate. See
; AIAEC/training_common.py's LinearAecEngine docstring for why RES/CNG are
; always disabled internally regardless of this choice.
preset = balanced

[model]
; Every key here is a keyword argument of AlignULCNet.__init__ (model.py).
; Commented values below ARE the constructor defaults.
; max_delay_seconds = 1.0
; gamma = 5
;   C-SamFR subband count parameter (Figure 2 of the paper); K_B=2, gamma=5
;   -> 130 subbands, 5 channels of 52 bins each -- see model.py's
;   ChannelSampledReorientation.
; subband_bins = 2
; compression_exponent = 0.3
;   Power-law compression on the input features -- also the value
;   AIAEC/training_common.py's compressed_spectral_loss uses by default, so
;   feature and loss domains share one compression law.
; max_delay_frames = none
;   Derived from [linear_aec]/[signal] to preserve the paper's one-second
;   physical delay span; set an integer to override.

[training]
output_dir = output
lr = 1e-3
weight_decay = 1e-4
amsgrad = true
max_epochs = 100
early_stop_patience = 15
grad_clip = 1.0

[loss]
; See AIAEC/training_common.py's compressed_spectral_loss: no candidate paper
; publishes a loss, so all six trainers share this one for comparability.
compression = 0.3
magnitude_weight = 1.0
complex_weight = 1.0
