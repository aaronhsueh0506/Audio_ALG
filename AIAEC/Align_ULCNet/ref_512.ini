; 512/256 reference: python3 train.py --config config.ini baseline.ini ref_512.ini
; Compare runs on waveform metrics or AECMOS; the loss scale follows the grid.

[signal]
n_fft = 512
win_len = 512
hop_len = 256

[data]
; A corpus materialized and packed at 512/256 (its linear_aec grid must match
; [signal]; build_plain_loaders refuses another).
packed_dir = data_aec_16k/packed/all

[model]
; Required: at 16 kHz/512 an unset max_delay_frames is the paper's D = 64,
; whatever max_delay_seconds says. 32 is the same 0.5 s as D = 63 at hop 128.
max_delay_frames = 32

[training]
output_dir = output_ref_512
