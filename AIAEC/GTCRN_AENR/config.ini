; ============================================================
; GTCRN-AENR training config
;
; Usage: python3 train.py --config config.ini   (see train.py's top-of-file
; docstring for the full CLI and for how to render/pack the dataset this
; file points at).
; ============================================================

[signal]
; GTCRN-AENR is LOCKED to upstream 16 kHz / 512/512/256 -- the model itself
; (GTCRNAENR.__init__) raises "upstream 16 kHz/512..." on any other grid.
; Do not try to run this candidate at 48 kHz; use one of the other five
; candidates for that, or GTCRNAENR's README for what a 48 kHz extension
; would require.
sr = 16000
n_fft = 512

[data]
; Output of: python3 -m AIAEC.dataset_gen.pack_aec_dataset --input data_aec/train --output data_aec/packed/train
packed_dir = data_aec/packed/train
; batch_size IS the lane count for SequenceChunkSampler: lane k walks one
; physical sequence across consecutive steps, so it must not exceed the
; number of sequences in the packed corpus.
batch_size = 8
num_workers = 4

[val_data]
; Optional. Delete this section to train without a validation pass.
packed_dir = data_aec/packed/val

[linear_aec]
; Which frozen production linear-AEC preset feeds this candidate. Must be a
; preset the real deployment could actually run (lib/aec/python/modules/config.py);
; RES and CNG are always disabled internally regardless of this choice -- see
; AIAEC/training_common.py's LinearAecEngine docstring for why.
preset = balanced

[model]
; Every key here is a keyword argument of GTCRNAENR.__init__ (model.py).
; Commented values below ARE the constructor defaults.
; erb_subband_1 = 65
; erb_subband_2 = 64

[training]
output_dir = output
lr = 1e-3
weight_decay = 1e-4
amsgrad = true
max_epochs = 100
early_stop_patience = 15
grad_clip = 1.0

[loss]
; See AIAEC/training_common.py's compressed_spectral_loss: no candidate paper
; publishes a loss, so all six trainers share this one for comparability.
compression = 0.3
magnitude_weight = 1.0
complex_weight = 1.0
