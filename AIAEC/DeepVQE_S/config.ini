; ============================================================
; DeepVQE-S training config
;
; Usage: python3 train.py --config config.ini   (see train.py's top-of-file
; docstring for the full CLI and for how to render/pack the dataset this
; file points at).
; ============================================================

[signal]
; MUST match the [signal] section the packed corpus below was rendered with
; (AIAEC/dataset_gen/config.ini). Selectable 16/48 kHz power-of-two grids
; (the paper used 24 kHz / 480/480/240; this project preserves the one-second
; physical delay span instead of copying dmax=100 -- see model.py).
sr = 16000
n_fft = 512
; win_len = 512
; hop_len = 256

[data]
; Output of (--output is sample-rate-specific: a generator run at another
; rate writes into its own data_aec_<rate>/, and the two MUST NOT share a
; directory: whichever sample rate was generated last would silently
; overwrite the other's seqs/packed content):
;   python3 -m AIAEC.dataset_gen.gen_aec_dataset --config ... --split all --hours 100 --output data_aec_16k
;   python3 -m AIAEC.dataset_gen.pack_aec_dataset --input data_aec_16k/all --output data_aec_16k/packed/all
; ONE unified pool. Training applies a deterministic random per-chunk split;
; evaluate source generalisation on a separate held-out corpus.
packed_dir = data_aec_16k/packed/all
; The paper uses batch 400 and 250 epochs.  Batch 8 is the largest that fits the
; available GPU and 50 epochs is this campaign's explicit compute limit; both
; are known deviations, not unknown paper values.  Gradient accumulation is
; not silently enabled because it would still leave BatchNorm observing eight
; samples and would not reproduce a true batch of 400. The paper does not give
; example duration, dataset hours, or steps/epoch, so no valid batch/time LR
; scaling can be derived from it.
batch_size = 8
num_workers = 4
; Held out at LOAD time by deterministic per-chunk random split. Chunks from
; the same sequence/speaker/RIR may intentionally straddle both sides.
; 0 = no validation pass (not recommended -- early stopping and *_best.pth
; both need one).
val_fraction = 0.1

[model]
; Every key here is a keyword argument of DeepVQES.__init__ (model.py).
; Commented values below ARE the constructor defaults.
; max_delay_seconds = 1.0
; similarity_channels = 4
; gru_hidden = 192
;   Inferred from the paper's published 0.59 M small-model class -- the
;   paper did not publish GRU width; see DeepVQE_S/README.md.
; compression_exponent = 0.3

[training]
output_dir = output
;
; Published DeepVQE recipe (arXiv:2306.03177): AdamW, lr=1.2e-3 and
; weight_decay=5e-7.  The paper does not publish a scheduler, so the least
; assumptive reproduction is constant LR; do not import DeepFilterNet2's
; warmup/cosine merely because both models process spectra.
;
; weight_decay = 5e-7 does NOTHING here, and this is arithmetic rather than a
; judgement: AdamW's decoupled decay multiplies each weight by (1 - lr*wd) per
; step, lr*wd = 6.0e-10 is 199x below float32 eps (1.19e-7), so the factor
; rounds to exactly 1.0f. Measured: 2000 steps of AdamW(5e-7) are bit-identical
; to AdamW(0) and to Adam(0), 0 tensors differing. So this run has no
; regularization and `adamw` vs `adam` is unobservable. At this lr, wd must
; reach about 5e-5 before it survives the rounding. The value is kept because
; it is the published value, but nothing should be argued from its numerical
; presence in this float32 implementation.
optimizer = adamw
lr = 1.2e-3
weight_decay = 5e-7
amsgrad = false
scheduler = constant
; Consulted only by the optional warmup_cosine comparison run.
min_lr = 1e-6
lr_warmup = 1e-4
warmup_epochs = 3
max_epochs = 50
; 0 disables early stopping so the requested 50-epoch budget completes.
; Validation still selects *_best.pth. train.py prints the resolved config and
; recipe before training so a launcher/config mismatch is immediately visible.
early_stop_patience = 0
grad_clip = 1.0

[loss]
; DeepVQE does not state its objective explicitly.  It is derived from
; Align-CRUSE, so this reference recipe inherits Align-CRUSE PLCPA and STFT
; consistency instead of inventing a cross-model generic loss.  beta=0.7
; weights the phase-aware complex term.
compression = 0.3
complex_weight = 0.7
; DO NOT run this on MPS. The projection is the only thing that puts
; torch.stft in the BACKWARD graph, and torch 2.8.0's MPS backend computes
; that backward incorrectly above 65,536 samples: measured, the shipped 10 s
; chunk (160,256 samples) gets a gradient 2.4x wrong while the forward stays
; exact and the loss curve descends normally. train.py defaults --device to
; None and auto-detect picks MPS when there is no CUDA, so that is the default
; launch on such a machine. training_common refuses it rather than warning.
; Pass --device cpu or a CUDA device, or set this false.
stft_consistency = true
