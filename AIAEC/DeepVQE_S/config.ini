; ============================================================
; DeepVQE-S training config
;
; Usage: python3 train.py --config config.ini   (see train.py's top-of-file
; docstring for the full CLI and for how to render/pack the dataset this
; file points at).
; ============================================================

[signal]
; MUST match the [signal] section the packed corpus below was rendered with
; (AIAEC/dataset_gen/config.ini). Selectable 16/48 kHz power-of-two grids
; (the paper used 24 kHz / 480/480/240; this project preserves the one-second
; physical delay span instead of copying dmax=100 -- see model.py).
sr = 16000
n_fft = 512
; win_len = 512
; hop_len = 256

[data]
; Output of: python3 -m AIAEC.dataset_gen.pack_aec_dataset --input data_aec/train --output data_aec/packed/train
packed_dir = data_aec/packed/train
batch_size = 16
num_workers = 4

[val_data]
; Optional. Delete this section to train without a validation pass.
packed_dir = data_aec/packed/val

[model]
; Every key here is a keyword argument of DeepVQES.__init__ (model.py).
; Commented values below ARE the constructor defaults.
; max_delay_seconds = 1.0
; similarity_channels = 4
; gru_hidden = 192
;   Inferred from the paper's published 0.59 M small-model class -- the
;   paper did not publish GRU width; see DeepVQE_S/README.md.
; compression_exponent = 0.3

[training]
output_dir = output
lr = 1e-3
weight_decay = 1e-4
amsgrad = true
max_epochs = 100
early_stop_patience = 15
grad_clip = 1.0

[loss]
; See AIAEC/training_common.py's compressed_spectral_loss: DeepVQE-S's paper
; did not publish loss details, so all six trainers share this one loss for
; comparability.
compression = 0.3
magnitude_weight = 1.0
complex_weight = 1.0
