; ============================================================
; DeepVQE-S training config
;
; Usage: python3 train.py --config config.ini   (see train.py's top-of-file
; docstring for the full CLI and for how to render/pack the dataset this
; file points at).
; ============================================================

[signal]
; MUST match the [signal] section the packed corpus below was rendered with
; (AIAEC/dataset_gen/config.ini). Selectable 16/48 kHz power-of-two grids
; (the paper used 24 kHz / 480/480/240; this project preserves the one-second
; physical delay span instead of copying dmax=100 -- see model.py).
sr = 16000
n_fft = 512
; win_len = 512
; hop_len = 256

[data]
; Output of (--output is sample-rate-specific: a generator run at another
; rate writes into its own data_aec_<rate>/, and the two MUST NOT share a
; directory: whichever sample rate was generated last would silently
; overwrite the other's seqs/packed content):
;   python3 -m AIAEC.dataset_gen.gen_aec_dataset --config ... --split all --hours 100 --output data_aec_16k
;   python3 -m AIAEC.dataset_gen.pack_aec_dataset --input data_aec_16k/all --output data_aec_16k/packed/all
; ONE unified pool. Training applies a deterministic random per-chunk split;
; evaluate source generalisation on a separate held-out corpus.
packed_dir = data_aec_16k/packed/all
; Paper uses 400; 8 is the largest batch that fits the available GPU.
batch_size = 8
num_workers = 4
; Held out at LOAD time by deterministic per-chunk random split. Chunks from
; the same sequence/speaker/RIR may intentionally straddle both sides.
; 0 = no validation pass (not recommended -- early stopping and *_best.pth
; both need one).
val_fraction = 0.1

[model]
; Every key here is a keyword argument of DeepVQES.__init__ (model.py).
; Commented values below ARE the constructor defaults.
; max_delay_seconds = 1.0
; similarity_channels = 4
; gru_hidden = 192
;   Inferred from the paper's published 0.59 M small-model class -- the
;   paper did not publish GRU width; see DeepVQE_S/README.md.
; compression_exponent = 0.3

[training]
output_dir = output
; Published DeepVQE optimizer recipe.  No LR scheduler is reported.
optimizer = adamw
lr = 1.2e-3
weight_decay = 5e-7
amsgrad = false
scheduler = constant
max_epochs = 50
; Equal to max_epochs so this 50-epoch campaign is not cut short.
early_stop_patience = 50
grad_clip = 1.0

[loss]
; DeepVQE does not state its objective explicitly.  It is derived from
; Align-CRUSE, so this reference recipe inherits Align-CRUSE PLCPA and STFT
; consistency instead of inventing a cross-model generic loss.  beta=0.7
; weights the phase-aware complex term.
compression = 0.3
complex_weight = 0.7
stft_consistency = true
