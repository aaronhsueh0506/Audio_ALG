; ============================================================
; AEC scenario dataset generation config
;
; Copy to config.ini and edit [paths].  This file configures generation only:
; model architecture, loss and optimizer belong in each model project's own
; config, exactly as in AINR/dataset_gen/config.example.ini.
;
; ⚠ Every time constant here is in SECONDS, never in frames -- but seconds are
;   not automatically portable across sample rates, so a rate change is more
;   than [signal].  The COMPLETE 48 kHz recipe is the keys listed here:
;       [signal]   sr = 48000, n_fft = 1024, win_len = 1024, hop_len = 512
;       [sequence] chunk_sec = 8.0
;       [codec]    source_sr_values = 8000, 12000, 16000, 24000, 32000
;       [devices]  speaker_lp_nyquist_frac_min = 0.1833
;       [devices]  speaker_lp_nyquist_frac_max = 0.3167
;   Each one is explained at its own section below.  Nothing else changes.
; ============================================================

[signal]
; 16 kHz is the first target.  For 48 kHz use the complete recipe at the top of
; this file -- these four keys are necessary but not sufficient on their own.
sr = 16000
n_fft = 512
win_len = 512
hop_len = 256
; sqrt-Hann (periodic), 50% overlap, COLA.
; ⚠ hop_len MUST be win_len/2 -- AecGrid rejects anything else, because
;   sqrt-Hann analysis + sqrt-Hann synthesis only sums to unity at 50% overlap.
;   win_len MUST equal n_fft; hidden FFT zero-padding is not allowed.
;   n_freqs (257) and frame_rate (62.5 fps) are DERIVED; do not restate them.

[linear_aec]
; Frozen Python PBFDKF used once per complete parent sequence to materialize
; Generated WAV STEM_ORDER[4] = linear_error; packed training index 2 is the
; same signal. The trainers never rerun it.
preset = balanced
; -1 selects 52 ms @16 kHz / 64 ms @48 kHz from lib/aec's production policy.
filter_length = -1
; frame_size defaults to [signal] n_fft and must match it.
; frame_size = 512
; The far-end delay profile is NOT configurable: generation is frozen at the
; matched 5-filter bank. delay_mode/delay_num_filters/fixed_delay_samples are
; refused here rather than ignored -- a corpus searched with a smaller bank has
; a different linear_error but an identical recorded contract. A different bank
; size is a diagnostic override (sweep_delay_depth.py --delay-num-filters).

[paths]
speech_dir = /path/to/clean_speech
noise_dir = /path/to/noise
rir_dir = /path/to/impulse_responses
; (the output location is NOT configured here -- gen_aec_dataset.py --output)

far_speech_dir =
; Optional independent far-end REFERENCE corpus (e.g. an AEC-Challenge clean
; ref set), so the far-end talker and the near-end talker never draw from the
; same speech pool/speaker. Leave blank to keep drawing both far-end and
; near-end from speech_dir (today's behaviour, zero change). This pool does
; NOT participate in the source-disjoint split or in --split train/val/all --
; the whole pool is always available, because nothing here needs a
; generalisation guarantee the way speaker/noise/room/device do.

; ============================================================
; Source-disjoint split
; ============================================================
[split]
val_fraction = 0.1
; Fraction of each SOURCE axis (speakers, noises, rooms, devices) held out --
; not a fraction of clips.  The realised clip fraction will differ from this
; because sources contribute unequal amounts of audio, and that is fine: the
; guarantee being bought is disjointness, not an exact ratio.

device_split = disjoint
; disjoint = validation loudspeakers were never heard in training.  This is the
;   honest question for a shipped device and is materially harder than the
;   usual AEC benchmark.
; shared   = ⚠ relaxes it.  The val score then answers "an unseen room with a
;   KNOWN loudspeaker", which is a different and easier question.  Say so
;   wherever the number is reported; the manifest records which was used.

; How a source path maps to the id the split is made over.  First regex group
; wins.  Leave blank to use the structural fallback noted for each axis.
speaker_id_regex = reader_(\d+)
; Fallback when blank or unmatched: the file's parent directory.
; DNS4 read_speech encodes the reader in the FILENAME, so the default regex
; matches that; a corpus with one directory per speaker can leave this blank.
noise_id_regex =
; Fallback: the filename stem, i.e. one id per noise file.
room_id_regex = (real_rirs_isotropic_noises/[^/]+)$
; Fallback (unmatched paths): the RIR's parent directory, i.e. one id per room
; folder -- correct for corpora laid out as .../RoomXXX/RoomXXX-00001.wav.
; ⚠ If every RIR sits in one flat directory this collapses to a single room and
;   the build fails loudly rather than producing a split that leaks.
;
; The DNS4 RIR set (SLR26 + SLR28) mixes BOTH shapes under one rir_dir:
;   SLR26/simulated_rirs_48k/{smallroom,mediumroom,largeroom}/RoomXXX/*.wav
;     -- one folder per room; the parent-dir fallback already gets this right,
;     the regex above simply never matches these paths.
;   SLR28/RIRS_NOISES/real_rirs_isotropic_noises/*.wav
;     -- FLAT: every file is an independent real-room recording with no
;     per-room folder. Without a regex the parent-dir fallback would collapse
;     every one of these into a single "room", so the default regex above
;     matches paths under real_rirs_isotropic_noises/ and captures the
;     directory+filename as a per-file (= per-room) id, leaving SLR26's paths
;     to fall through to the parent-dir fallback untouched.
; Pointed at a non-DNS4 RIR corpus, clear this back to blank (or replace it)
; if that corpus doesn't have a real_rirs_isotropic_noises/ subtree.

; ============================================================
; Sequence and chunk geometry
; ============================================================
[sequence]
seq_sec_min = 20.0
seq_sec_max = 30.0
; Parent sequences are long on purpose: adaptation and echo-path-change
; recovery are invisible inside a single 10 s clip, and a model that never
; sees more than 10 s cannot be shown to fail at either. But they don't need to
; be AS long as this range once suggested -- lib/aec/docs/
; c_user_manual_zh_TW.md records cold-start convergence at 0.5-2 s
; and echo-path-change re-convergence at ~200 ms. The one thing that genuinely
; needs tens of seconds is the SRO impairment (clock drift accumulating faster
; than the filter can absorb -- see [sro]'s own comment), and its [impairments]
; draw is only 4% -- about 3.5% of all parent sequences, once echo-path
; impairments are stripped from near-only/no-echo plans. This range is
; deliberately NOT stretched to suit it. seq_sec_min=20 guarantees at least
; 2 whole chunks (20/10) so a sequence still shows an early vs. a later point
; on its own adaptation trajectory; seq_sec_max=30 keeps the same
; up-to-3-chunks (30/10) shape the old 24.0/8.0 pair gave.
chunk_sec = 10.0
; Consecutive chunks share sequence_id and increasing chunk_index. Packing
; preserves that order for re-materialization and streaming evaluation;
; training intentionally applies a random per-chunk split/shuffle.
; ⚠ chunk_sec must divide into seq_sec_min at least once; a sequence is
;   floor(duration / chunk_sec) whole chunks.
; ⚠ chunk_sec is NOT portable across sample rates. The linear-AEC frontend
;   consumes whole hops, and its (frame, hop) is frozen per rate in
;   linear_aec.py's FROZEN_FRAME_HOP_BY_SR -- 512/256 at 16 kHz, 1024/512 at
;   48 kHz -- so the value here must satisfy
;       round(chunk_sec * sr) % hop == 0
;   That is a property of the frozen contract, not a hop to be un-hardcoded
;   somewhere. 10.0 is exact at 16 kHz (160000 / 256 = 625) and is NOT at
;   48 kHz (480000 / 512 = 937.5, and generation refuses it); among whole
;   seconds, 48 kHz admits only multiples of 4. Use chunk_sec = 8.0 at
;   48 kHz: exact on both grids (128000 / 256 = 500, 384000 / 512 = 750), and
;   it keeps the same 2-3 whole chunks per sequence that 10.0 gives over
;   seq_sec_min/seq_sec_max = 20/30 (int(20/8) = 2, int(30/8) = 3).

; ============================================================
; Layered scene planner
;
; Speech activity, echo availability and physical impairments are deliberately
; separate.  The old single [scenarios] draw made double talk mutually
; exclusive with path movement, loudspeaker nonlinearity and clipping -- the
; exact intersections in difficult DT recordings were therefore absent.
; ============================================================
[talk_modes]
; Relative weights; normalised, so they need not sum to 1.
p_double_talk = 0.24
; The hardest and most important case: near speech must survive while echo goes.
p_far_only = 0.20
; Pure cancellation, and the only place ERLE is cleanly measurable.
p_near_only = 0.12
; The idle case: nothing to cancel, so any damage here is pure regression.
p_duplex_random = 0.44
; Independent far/near activity. This absorbs the old impairment-only share;
; impairments are now layered onto all compatible talk modes below.

[echo_modes]
; Conditional probabilities among sequences with a far-end talker. They are
; mutually exclusive and their sum must be <= 1; the remainder is normal echo.
p_ref_dropout = 0.08
; ⚠ LOAD-BEARING. Teaches every route that a silent reference means no echo.
;   Joint NR models may still suppress local noise, so output~=mic is only the
;   AEC-only route's expectation, not a universal gate.
p_far_active_no_echo = 0.03
; The converse of ref_dropout: the reference is active but no acoustic echo
; reaches the microphone. This condition cannot be represented by merely
; increasing ERL to the current 30 dB cap.
; The far activity scheduler covers the complete parent sequence for this hard
; negative -- as back-to-back utterances, each drawing its own file, so the
; reference cannot run out partway -- and the per-chunk label is measured
; rather than asserted, so a chunk is only called far_active_no_echo when its
; reference really is playing. With the default talk mix this contributes
; about 2.6% of all parent/chunk hours.

[impairments]
; Independent Bernoulli probabilities. Compatible impairments may co-occur;
; echo-path impairments are automatically removed from near-only/no-echo plans.
p_echo_path_change = 0.08
p_nonlinear_spk = 0.08
p_clipping_agc = 0.06
p_delay_jitter = 0.06
p_sro = 0.04
p_codec_mismatch = 0.04

[acoustic_tails]
; Independent, low-probability operating-point tails. These do not widen the
; ordinary ranges below: a sequence uses either its ordinary range or the
; corresponding tail range. Drawn only when a real far/echo path exists.
p_long_delay = 0.08
long_delay_ms_min = 120
long_delay_ms_max = 300
; Starts where the ordinary range ends, so 121--160 ms no longer depends on
; the delay_jitter impairment alone; covers USB/Bluetooth/mixed-device paths
; such as a measured ~205 ms double-talk capture, and stays inside the frozen
; n=5 frontend's 509.25 ms reach (tail + jitter 40 ms + RIR pre-delay 1 ms).

p_quiet_far = 0.08
quiet_far_dbfs_min = -40
quiet_far_dbfs_max = -30
quiet_far_erl_db_max = 15
; Covers quiet digital references observed below the ordinary -30 dBFS floor.
; The ERL draw is capped at quiet_far_erl_db_max for these sequences (unless
; strong_echo is drawn too): with the ordinary 30 dB cap the echo would sit
; as low as -70 dBFS, under the local-noise floor, and the measured per-chunk
; labels would stop describing the audio.

p_strong_echo = 0.08
strong_echo_erl_db_min = -10
strong_echo_erl_db_max = 0
; Negative ERL means the microphone echo is louder than the stored reference.
; [mic] peak_guard then usually rescales EVERY stem together, so the stored
; reference of such a sequence often ends below far_level_dbfs_min; ratios
; (ERL/SER/SNR) are preserved, absolute levels are not.

[complex_cases]
p_dt_stress_combo = 0.08
; Conditional on double_talk: force path change + nonlinear loudspeaker +
; clipping/AGC together when echo_mode is normal. At the default mix this is
; expected about 1.7% of parent sequences. The CLI prints the realised count
; for the selected seed/hours so the tail can be verified before training.
p_dt_acoustic_combo = 0.06
; Conditional on normal-echo double_talk: force long delay + quiet far +
; strong echo together. The same three tails are also drawn independently,
; so short-delay strong-echo and long-delay ordinary-level cases still exist.
; At the default mix this is about 1.3% of parent sequences (0.06 forced plus
; the 0.08^3 independent triple); each single tail lands on about 7.4%.

; ============================================================
; Levels. All ratios are measured with ACTIVE RMS (AINR/dataset_gen/dataset.py's
; active_rms), so a talker who pauses more is not made quieter.
; ============================================================
; ⚠ ser_db / snr_db / erl_db in the metadata are SEQUENCE-level: they describe
;   how the whole configured parent sequence was set up. A single chunk can depart from
;   them by a few dB (ERL) or by anything at all (SER/SNR), because a chunk in
;   which the near talker happens to be silent has no signal to define a ratio
;   against. Filter a curriculum on `scenario`, not on these numbers -- or
;   measure the chunk yourself, which the separated stems make possible.
[levels]
far_level_dbfs_min = -30
far_level_dbfs_max = -14
; Active level of the stored far-end reference.

erl_db_min = 0
erl_db_max = 30
; Echo return loss: how much quieter the echo is than the reference.
; 0 dB is a hands-free speaker sitting next to the mic; 30 dB is a well
; separated headset. Measured against the STORED reference, so a consumer can
; verify erl_db directly from the shard.

ser_db_min = -10
ser_db_max = 15
; Signal(near)-to-echo ratio during double talk. ⚠ -10 dB is the documented
; out-of-spec edge for near-end preservation (see the SER spec note in the
; project memory); values below it are deliberately excluded rather than
; clipped, so "out of spec" stays a statement about the product and not about
; a corpus artefact.

snr_values = -5, 0, 5, 10, 20, 40
; Local noise vs near speech. Deliberately the SAME discrete set the NR
; generator uses (AINR/dataset_gen/config.example.ini), drawn with the same
; parse_snr_values/sample_snr helpers, so the two corpora are comparable on the
; noise axis instead of being two different definitions of "10 dB SNR".

near_level_dbfs_min = -35
near_level_dbfs_max = -18
; Absolute near-speech level for sequences with NO echo, where SER is
; undefined. Those clips record ser_db = +inf rather than a made-up number.

noise_level_dbfs_min = -55
noise_level_dbfs_max = -35
; Absolute noise level for sequences with NO near speech, where SNR is
; undefined. Those clips record snr_db = -inf.

; ============================================================
; Conversational rhythm
; ============================================================
[activity]
far_talk_sec_mean = 3.0
far_gap_sec_mean = 1.2
near_talk_sec_mean = 2.5
near_gap_sec_mean = 2.0
; Means of the exponential talk/silence runs, in seconds.

dt_overlap_p = 0.7
dt_overlap_frac_min = 0.3
dt_overlap_frac_max = 0.9
dt_force_edge_overlap = true
; In a double_talk sequence, each far-end burst gets near speech forced into it
; with probability dt_overlap_p, covering this fraction of the burst.
; In the complex DT tail, dt_force_edge_overlap pins the near talker to the
; start of the first far burst and the end of the last: the first exercises a
; cold PBFDKF/model state and the last exercises a mature state. Ordinary DT
; and middle bursts still use dt_overlap_p, so normal conversations dominate.
; ⚠ Without this, two independent activity chains produce mostly single talk
;   and the "double talk" label would be largely a lie.

talk_fade_sec = 0.005
; Fade at each utterance boundary. A hard splice is a broadband click, and the
; model would learn to use it as the onset cue.

; ============================================================
; Room impulse responses
; ============================================================
[rir]
rt60_min = 0.1
rt60_max = 1.2
; Schroeder-integration RT60 filter, applied once when the manifest is built.
; RIRs outside the range are excluded from BOTH splits.
early_rir_ms = 20.0
pre_delay_keep_ms = 1.0
; Passed straight to AINR/dataset_gen/dataset.py's prepare_rir. The full RIR makes
; near_speech for microphone mixing/audit; the early/late-suppressed RIR makes
; near_target, the common target for every selected model.
; ⚠ The loudspeaker RIR and the near-talker RIR are always drawn from the SAME
;   room -- they are the same physical space. Mixing rooms would hand the model
;   an acoustic "this is echo" cue that no real device has.

; ============================================================
; Echo path timing
; ============================================================
[echo_path]
bulk_delay_ms_min = 10
bulk_delay_ms_max = 120
; Playout + capture buffering between the reference and the echo reaching the
; mic. Recorded per clip as bulk_delay_samples.
; Ordinary-range component. [acoustic_tails] adds a separately counted
; 160--300 ms low-probability component without moving this main distribution.
; With [rir] pre_delay_keep_ms the largest ordinary echo delay a clip can carry
; is ~121 ms, and delay_jitter adds at most
;   jitter_steps_max * jitter_ms_max = 40 ms on top. A capture whose true delay
;   exceeds that uses the explicit long-delay tail. Going beyond the frozen
;   frontend's measured 509.25 ms reach is NOT a config-only change:
;   linear_aec.MATCHED_REACH_MS and lib/aec must move together with this
;   value, or the frontend mis-locks and the label becomes fiction.

path_change_fade_sec = 0.02
; Crossfade when the echo RIR switches. A hard switch is a step discontinuity,
; i.e. a click the model can detect the event by -- a cue no real echo-path
; change provides.

jitter_steps_min = 2
jitter_steps_max = 5
jitter_ms_min = 1
jitter_ms_max = 8
jitter_fade_sec = 0.01
; delay_jitter scenario: discrete delay steps, i.e. dropped or duplicated
; playout buffers. ⚠ Deliberately NOT a slow ramp -- that is the sro scenario,
; and the two disturbances need different handling, so one must not stand in
; for the other.

; ============================================================
; Sample-rate offset
; ============================================================
[sro]
ppm_min = 1.0
ppm_max = 60.0
; Far-end and mic clocks drifting apart, sign drawn per sequence. Applied to
; the played path only, so X and D pull apart over the sequence.
; 60 ppm over 60 s at 16 kHz is 58 samples -- far more than an echo canceller's
; filter can absorb without re-converging, which is the point.

; ============================================================
; Codec mismatch on the played path
; ============================================================
[codec]
source_sr_values = 8000, 12000
; Only rates below [signal] sr are used, so this list is rate-dependent too.
; ⚠ At sr = 48000 these two alone survive the filter and become a 4-6x
;   downsample, where at 16 kHz they are 1.3-2x -- a far harsher distortion
;   than the one this augmentation is meant to model. Add 16000, 24000, 32000
;   there, as the recipe at the top of this file does.
bits_min = 4
bits_max = 8
; mu-law requantisation depth. ⚠ This is a codec-like distortion, NOT any
; particular codec; see simulate_codec's docstring. No result may be reported
; as "robust to <codec>".

; ============================================================
; Playback / capture devices
; ============================================================
[devices]
device_ids = spk_a, spk_b, spk_c, spk_d, spk_e, spk_f, spk_g, spk_h
; ⚠ These are split disjointly (see [split] device_split), so you need enough
;   of them for both sides to be meaningful. Each id deterministically fixes a
;   nonlinearity, a drive, a loudspeaker EQ and a mic EQ, derived from the id
;   plus --seed. The same id therefore always means the same device.

nonlinear_models = linear, softclip_tanh, arctan, hardclip, sef, poly_odd, diode
; Memoryless loudspeaker distortion. 'sef' is the sigmoidal expansion function
; standard in the nonlinear-AEC literature; 'diode' is the only asymmetric one
; and so the only source of even-order harmonics.

drive_min = 1.0
drive_max = 3.5
nonlinear_spk_drive_boost = 2.0
; The nonlinear_spk scenario multiplies the device's drive by this and forces a
; non-linear device, so the label cannot be a lie.

speaker_hp_hz_min = 120
speaker_hp_hz_max = 400
speaker_lp_nyquist_frac_min = 0.55
speaker_lp_nyquist_frac_max = 0.95
; Radiated band of a small loudspeaker.
; ⚠ The low-pass is expressed as a fraction of NYQUIST, but a real driver's
;   rolloff sits at an absolute frequency, so the fraction does NOT carry
;   across rates -- it must be rescaled or the band-limit silently stops
;   doing anything. Measured through the shipped lowpass_biquad call at
;   6 kHz, across the device population:
;       16 kHz, these fractions   -> fc 4400-7600 Hz, -12.74..-0.27 dB
;       48 kHz, fractions UNCHANGED -> fc 13200-22800 Hz, -0.37..-0.00 dB
;   The spread between devices collapses from 12.5 dB to 0.4 dB: the devices
;   stop differing from one another and device-disjoint validation loses an
;   axis. The 48 kHz fractions in the recipe at the top of this file put the
;   cutoffs back on the same absolute 4.4-7.6 kHz band (-7.32..-1.87 dB,
;   5.5 dB of spread). Note that is not the 16 kHz response restored: a
;   bilinear-transformed biquad warps differently near Nyquist, and 7600 Hz
;   is 95% of Nyquist at 16 kHz but only 32% at 48 kHz. The absolute band is
;   what is portable here, not the curve.

n_biquad_filters = 3
biquad_gain_db = 12.0
mic_eq_gain_db = 8.0
biquad_q_min = 0.5
biquad_q_max = 1.5
; Loudspeaker EQ reuses AINR/dataset_gen/dataset.py's rand_biquad_filter under a
; per-device seed. The MIC cascade is built from the same coefficient cookbook
; but applied without RMS normalisation -- ⚠ it must be identical across S, N
; and D, or mic_preclip would stop equalling their sum.

; ============================================================
; Local noise
; ============================================================
[noise]
max_noise_mix = 1
; Project AEC choice: one ambient source per sequence. Upstream DFN3's NR
; synthesizer mixes 2--5 noise files; do not cite this value as upstream parity.

; ============================================================
; Reference dropout
; ============================================================
[dropout]
ref_dropout_chunks_min = 1
ref_dropout_chunks_max = 4
; Dropouts are chosen as WHOLE chunks, so a chunk labelled 'ref_dropout' is
; unambiguously an idle chunk and the hard gate has clean supervision. The
; remaining chunks of the sequence are labelled by what they actually contain.
;
; ⚠ p_ref_dropout is conditional on a far-capable parent sequence, and the
;   resulting per-CHUNK share is smaller because only a subset of that
;   sequence's chunks are dropped. If the idle-loss term needs more, raise
;   this range rather than p_ref_dropout -- longer dropouts, not more parent
;   sequences that are mostly not dropouts.
;   The other source of idle supervision is 'near_only', where the far end is
;   absent for the whole sequence (X == 0 and D == 0 there too). ref_dropout is
;   still the load-bearing one because it is the only place the TRANSITION into
;   and out of idle appears, and that transition is the hard part.

ref_dropout_echo_continues_p = 0.0
; ⚠ KEEP AT 0 unless you know exactly why you are raising it. At 0 the far end
;   is genuinely silent: X == 0 AND D == 0, so the correct echo estimate is
;   zero and E == Y exactly -- which is what makes "ref == 0 implies output ~=
;   mic" supervisable. Above 0, the loudspeaker keeps playing while the
;   reference is lost, so the target echo is unpredictable from the input and
;   the model is being trained to hallucinate one.

; ============================================================
; Microphone capture
; ============================================================
[mic]
peak_guard = 0.99
; ALL internal signals (far_render, echo, near_speech, near_target,
; local_noise, mic_preclip -- echo, local_noise and mic_preclip are not
; persisted, see aec_features.py's STEM_ORDER) are scaled by ONE common
; factor if any of them exceeds this, including the three that never reach
; disk.
; ⚠ Scaling them independently would break mic_preclip == S + N + D; leaving
;   the reference out would silently change the ERL the metadata claims.

p_clipping = 0.05
clip_snr_min = 5
clip_snr_max = 20
; Background probability of capture clipping when the clipping_agc impairment
; was not drawn (that impairment always clips). Reuses
; AINR/dataset_gen/dataset.py's apply_clipping.
; Recorded per clip as `clipped`; the AGC below is recorded separately as `agc`
; because they are different distortions and a model that confuses them fixes
; the wrong one. Together the two flags are exact: mic_postclip differs from
; mic_preclip if and only if one of them is set.

p_agc = 0.10
agc_target_dbfs = -20
agc_attack_sec = 0.05
agc_release_sec = 1.5
agc_max_gain_db = 18
; Slow capture AGC. Both time constants are SECONDS and go through
; alpha_from_tau, so they mean the same thing at 16 and 48 kHz.
; ⚠ Only mic_postclip is affected. mic_preclip stays the exact sum of the three
;   source stems, which is what lets clipping/AGC effects be separated from
;   echo-path nonlinearity.
