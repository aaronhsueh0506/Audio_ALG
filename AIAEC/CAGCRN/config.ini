; ============================================================
; CAGCRN training config
;
; Usage: python3 train.py --config config.ini   (see train.py's top-of-file
; docstring for the full CLI and for how to render/pack the dataset this
; file points at).
; ============================================================

[signal]
; The paper used 16 kHz/512/512/256, exactly matching this project's 16 kHz
; grid -- must equal the [signal] section the packed corpus below was
; rendered with (AIAEC/dataset_gen/config.ini).
sr = 16000
n_fft = 512
; win_len = 512
; hop_len = 256

[data]
; Output of (--output is sample-rate-specific: a generator run at another
; rate writes into its own data_aec_<rate>/, and the two MUST NOT share a
; directory: whichever sample rate was generated last would silently
; overwrite the other's seqs/packed content):
;   python3 -m AIAEC.dataset_gen.gen_aec_dataset --config ... --split all --hours 100 --output data_aec_16k
;   python3 -m AIAEC.dataset_gen.pack_aec_dataset --input data_aec_16k/all --output data_aec_16k/packed/all
; ONE unified pool. Training applies a deterministic random per-chunk split;
; evaluate source generalisation on a separate held-out corpus.
packed_dir = data_aec_16k/packed/all
; Paper batch size.
batch_size = 32
num_workers = 4
; Held out at LOAD time by deterministic per-chunk random split. Chunks from
; the same sequence/speaker/RIR may intentionally straddle both sides.
; 0 = no validation pass (not recommended -- early stopping and *_best.pth
; both need one).
val_fraction = 0.1

[model]
; Every key here is a keyword argument of CAGCRN.__init__ (model.py).
; Commented values below ARE the constructor defaults.
; high_erb_bands = 32
;   ERB band merging above the paper's linear-bin cutoff (retained through
;   2 kHz) -- the paper did not publish the ERB-band count.
; max_delay_seconds = 1.0
;   The paper's proposed learnable integer floor(D) delay window is not
;   ordinarily differentiable (see model.py); this implementation uses a
;   soft delay-window gate over this configurable one-second buffer instead.

[training]
output_dir = output
; Paper recipe.  No LR scheduler is reported.
optimizer = adamw
lr = 1e-3
weight_decay = 5e-7
amsgrad = false
scheduler = constant
max_epochs = 50
; Equal to max_epochs so this 50-epoch campaign is not cut short.
early_stop_patience = 50
grad_clip = 1.0

[loss]
; Paper objective L_MSE + L_SI-SNR + L_L1.  The paper does not publish
; separate coefficients, so all three stay at one.  L1 is the mean absolute
; model-parameter value (normalised by parameter count, not tensor size sum).
mse_weight = 1.0
si_snr_weight = 1.0
l1_weight = 1.0
eps = 1e-8
