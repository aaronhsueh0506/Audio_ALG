; ============================================================
; Align-CRUSE training config
;
; Usage: python3 train.py --config config.ini   (see train.py's top-of-file
; docstring for the full CLI and for how to render/pack the dataset this
; file points at).
; ============================================================

[signal]
; MUST match the [signal] section the packed corpus below was rendered with
; (AIAEC/dataset_gen/config.ini). This file does not re-derive the grid from
; the data; a mismatch fails loudly at PackedAecDataset construction
; (expected_sr check) rather than silently reframing.
sr = 16000
n_fft = 512
; win_len defaults to n_fft, hop_len defaults to win_len/2 -- AecGrid enforces
; 50% overlap and forbids hidden zero-padding, so leave both commented out
; unless you have a specific reason to override them explicitly.
; win_len = 512
; hop_len = 256

[data]
; Output of (--output is sample-rate-specific: a generator run at another
; rate writes into its own data_aec_<rate>/, and the two MUST NOT share a
; directory: whichever sample rate was generated last would silently
; overwrite the other's seqs/packed content):
;   python3 -m AIAEC.dataset_gen.gen_aec_dataset --config ... --split all --hours 100 --output data_aec_16k
;   python3 -m AIAEC.dataset_gen.pack_aec_dataset --input data_aec_16k/all --output data_aec_16k/packed/all
; ONE unified pool. Training applies a deterministic random per-chunk split;
; evaluate source generalisation on a separate held-out corpus.
packed_dir = data_aec_16k/packed/all
batch_size = 16
num_workers = 4
; Held out at LOAD time by deterministic per-chunk random split. Chunks from
; the same sequence/speaker/RIR may intentionally straddle both sides.
; 0 = no validation pass (not recommended -- early stopping and *_best.pth
; both need one).
val_fraction = 0.1

[model]
; Every key here is a keyword argument of AlignCRUSE.__init__ (model.py);
; an unrecognised key raises rather than silently building the default shape.
; Commented values below ARE the constructor defaults -- uncomment to change.
; max_delay_seconds = 1.0
; projection_size = 64
; gru_hidden = 192
alignment_mode = causal_running
;   paper_global   -- one D[B,dmax] vector per utterance (as published)
;   causal_running -- D[B,T,dmax], past evidence only; deployment default.
;                     NOT the graph a paper-compatible checkpoint expects.

[training]
output_dir = output
; Paper optimizer values. The project schedule is three local epochs of linear
; warmup followed by per-optimizer-step cosine decay. The lower warmup start is
; intentional because this model's base LR is only 1.5e-4.
optimizer = adam
lr = 1.5e-4
;
; This is Adam's coupled L2 penalty, not AdamW's decoupled multiplicative
; shrink.  It is added to the gradient before Adam's moment updates, so the
; float32 `(1-lr*wd)` rounding argument used for AdamW does not apply here.
; Keep the published value; do not describe it as inert merely because it is
; numerically small.
weight_decay = 5e-6
amsgrad = false
scheduler = warmup_cosine
min_lr = 1e-6
lr_warmup = 1e-5
warmup_epochs = 3
max_epochs = 50
; 0 explicitly disables early stopping. Validation still selects *_best.pth,
; while the requested 50-epoch campaign completes. The paper does not state a
; stopping rule, and its example duration / steps per epoch are not published,
; so inventing a local patience would not be a paper-aligned adaptation.
early_stop_patience = 0
grad_clip = 1.0

[loss]
; Paper PLCPA loss after STFT consistency: beta=0.7 phase-aware complex MSE
; plus (1-beta)=0.3 magnitude MSE, both power-compressed by c=0.3.
compression = 0.3
complex_weight = 0.7
; DO NOT run this on MPS. The projection is the only thing that puts
; torch.stft in the BACKWARD graph, and torch 2.8.0's MPS backend computes
; that backward incorrectly above 65,536 samples: measured, the shipped 10 s
; chunk (160,256 samples) gets a gradient 2.4x wrong while the forward stays
; exact and the loss curve descends normally. train.py defaults --device to
; None and auto-detect picks MPS when there is no CUDA, so that is the default
; launch on such a machine. training_common refuses it rather than warning.
; Pass --device cpu or a CUDA device, or set this false.
stft_consistency = true
