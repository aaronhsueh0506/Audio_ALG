[signal]
sr = 48000
n_fft = 1024
win_len = 1024
hop_len = 512
; 48 kHz full-band, radix-2 FFT; 21.33ms/10.67ms frames

[model]
n_erb = 32
; Number of ERB bands for the ERB path encoder/decoder
df_bins = 96
; 1024-point FFT @ 48k: bins 0..95 cover 0..4.453kHz
; ⚠ DIVERGES from upstream in Hz, not in bin count.  DFN3 also uses 96, but at
; hop 480 / n_fft 960 that is 50.0 Hz per bin = 4800 Hz; here it is 46.875 Hz per
; bin = 4500 Hz, so the DF/ERB crossover sits exactly 300 Hz lower and 6 more
; bins are handed to the ERB mask.  Matching upstream's cutoff would need 102-103
; bins, which changes the feature contract and requires retraining -- 96 is
; deliberate, not copied.  See UPSTREAM_ALIGNMENT.md do-not-touch item 3.
df_order = 5
; 5-tap deep filter. df_lookahead=L means taps [t-(4-L), ..., t+L].
mask_lookahead = 1
df_lookahead = 1
; ⚠ DELIBERATELY NOT ALIGNED TO UPSTREAM -- operator decision, do not "fix".
; All three released upstream configs ship conv_lookahead=2 (and DFN2/DFN3
; df_lookahead=2).  This port runs 1/1 to halve algorithmic latency: at hop 512 /
; 48 kHz one frame is 10.67 ms, so 1/1 costs ~10.7 ms where 2/2 would cost
; ~21.3 ms.  Upstream pays ~20 ms at its hop 480.
;
; The mechanism is correct at either value; only the receptive field changes. At
; df_order=5 the DF window is [t-(4-L) .. t+L], so L=1 gives [t-3 .. t+1] where
; upstream's L=2 gives the symmetric [t-2 .. t+2] -- same five taps, different
; centring.  Quality cost is UNVERIFIED: no upstream ablation at lookahead 1
; exists.
;
; Upstream relates the two (conv_lookahead >= df_lookahead); enforced once, in
; DeepFilterNet3.__init__.
;
; ⚠ df_lookahead was 0 at one point while mask_lookahead was 1, which bought
; nothing: the one-frame delay is already paid for by the mask path, so a strictly
; causal DF window simply declined a future tap that was already free.
emb_size = 256
; GRU *hidden* width only.  The embedding BUS is enc_channels * n_erb // 4
; (= 512 here), which is what flows between encoder and decoders.
enc_channels = 64
; = upstream [deepfilternet] conv_ch.  The ModelParams *default* is 16, but the
; shipped DeepFilterNet3 config overrides it to 64; building from the source
; defaults gives a different model entirely.
emb_num_layers = 3
; Total embedding GRU depth, SPLIT between encoder (a hardcoded 1) and the ERB
; decoder (emb_num_layers - 1 = 2).  Reading this as the encoder's own depth is
; the trap this port previously fell into.
df_num_layers = 2
lin_groups = 16
enc_lin_groups = 32
; GroupedLinearEinsum group counts.  ⚠ df_dec.df_gru deliberately does NOT get
; lin_groups: upstream leaves it at SqueezedGRU_S's own default of 8
; (checkpoint shape (8, 64, 32) confirms).  Do not "fix" that asymmetry.
enc_concat = false
; false -> the ERB and DF branches are ADDed and the bus stays 512 wide.
df_gru_skip = groupedlinear
df_pathway_kernel_size_t = 5
conv_kernel = 1,3
conv_kernel_inp = 3,3
mask_pf = false
pf_beta = 0.02
; Valin post-filter.  = released DeepFilterNet3 `mask_pf` (ships FALSE) and
; `PF_BETA` (0.02, deepfilternet3.py:69, exposed as `--pf`).  Shipped behaviour is
; unchanged because mask_pf is false.  Both live in [model] because both are
; constructor arguments (read_model_config is signature-driven over this section).
;
; ⚠ DFN3's form, NOT DFN2's -- they are not interchangeable.  DFN3 applies it to
; the FINAL COMPLEX SPECTRUM after both the ERB mask and the deep filter, derives
; its mask as |spec_e|/|spec| (the gain actually realised) rather than
; post-filtering the network's mask, has no `mask` factor in the numerator, and
; does NOT gate on training.  DFN2 instead post-filtered the real ERB mask before
; erb_inv, inference-only, with beta hardcoded in the method signature.
; ⚠ Because it is ungated, enabling it changes the TRAIN objective too -- and
; validation runs in eval() either way, so at true the val loss (hence
; best-checkpoint selection) is computed through the post-filter.
convt_kernel = 1,3
; convt_kernel is separate in DFN3; DFN2 reused conv_kernel.

[feature]
erb_norm_tau_sec = 1.0
erb_norm_init_lo_db = -60.0
erb_norm_init_hi_db = -90.0
; = libDF MEAN_NORM_INIT (lib.rs:12).  NOT calibrated for this bank: measured band
; levels here sit +38.97 dB higher (triangular energy-SUM bank).  The corpus-fitted
; pair is -17.35/-57.81; it was shipped (37db9df) and REVERTED -- it trained worse
; on an identical corpus and the reason is still open.
; ⚠ These pair with erb_norm_scale_db below: |-100 dB log floor - (-60)| = 40 bounds
;   a numerically-silent band at exactly -1.00, upstream's own range.  Restoring
;   -15/-60 needs scale_db = 85, not 40.
; ⚠ Do NOT restore the bound by raising the log floor: floored cells go 0.58% ->
;   7.72% (20.5% in bands 22-31), destroying real HF content.
; Full record incl. the seven falsified divergence mechanisms:
;   UPSTREAM_ALIGNMENT.md, normalisation item 4.
erb_norm_scale_db = 40.0
spec_norm_tau_sec = 1.0
spec_norm_init_lo = 0.001
spec_norm_init_hi = 0.0001
; = libDF UNIT_NORM_INIT (lib.rs:13), restored with the pair above.
; ⚠ NO spec_norm_eps: libDF divides by a bare sqrt (lib.rs:257) and positivity is
;   structural here (mu >= alpha^t * mu_0 > 0, and fp32 pins at a subnormal rather
;   than reaching 0).  The one case where that fails is FTZ / denormals-are-zero or
;   AMP -- a DEPLOYMENT concern, so guard it in the C port, not by diverging the
;   trainer.  read_feature_config now REJECTS the key so a stale copy cannot read
;   as honoured.
; ⚠ FOR WHOEVER WRITES THE C PORT: add the epsilon back there.  The working
;   precedent is AINR/RNNoise-ERB/process.c, which does
;   `sqrtf(state + RNNOISE_SPEC_NORM_EPS)` with the constant in process.h -- the
;   same value this trainer dropped, kept exactly where it belongs.
; ⚠ alpha is DERIVED from tau, never configured: make_norm_alpha reproduces
;   upstream's rounding loop (df/utils.py:111-128).  At 48k/hop512, tau=1s gives
;   0.989 -- a number that appears in no upstream config, because upstream's hop 480
;   gives a different one.  Keeping tau in seconds is what makes this grid-
;   independent.  Side effect: 3-decimal rounding makes the effective tau 0.9644 s.

[training]
epochs = 120
; = released DeepFilterNet3 max_epochs.  UPSTREAM VALUE (was 100).  The LR and WD
; cosine schedules are indexed by epoch fraction, so this stretches both horizons
; by 1.2x rather than just adding 20 epochs at the end.
batch_size = 16
; ⚠ MEASURED, and the previous note here blamed the wrong thing: the dominant
; consumer is NOT the DF context buffer, it is the four-resolution MRSL loss graph.
; Because hop = n_fft // 4, every fft_size has the SAME frames x bins product
; (~289k at 3 s / 48 kHz), so the four resolutions cost the same and the total is
; ~83 MB of retained graph per batch item:
;     batch 16 -> ~1.3 GB      batch 32 -> ~2.7 GB      batch 64 -> ~5.3 GB
; A batch that OOMs reports at the loss STFT, because that is the largest single
; allocation -- not because the STFT is the leak.
; ⚠ The cheapest real lever is fft_sizes: dropping any ONE resolution frees 25%.
; But that is a LOSS_VERSION change and a divergence from upstream's shipped list,
; so lower the batch first.
lr = 1e-3
min_lr = 1e-6
lr_warmup = 1e-4
warmup_epochs = 3
weight_decay = 1e-12
weight_decay_end = 0.01
; Shipped DeepFilterNet3 [optim]: almost no weight decay initially,
; cosine-increase to 0.01.  (0.05 was DeepFilterNet2's value.)
grad_clip = 1.0
amsgrad = true
; Upstream hardcodes amsgrad=True on its adamw branch (df/train.py:495); PyTorch's
; default is False, so this port ran without it until now.
; ⚠ Set this to FALSE when reproducing an earlier run.  It changes the optimizer
; trajectory from step 1, so leaving it on while also changing something else
; means a run that succeeds cannot tell you which change fixed it.  It is exposed
; for exactly that reason -- controlled A/B, not tuning.
early_stop_patience = 25
; = released DeepFilterNet3 early_stopping_patience.  UPSTREAM VALUE (was 20).
;
; ⚠ NOT ALIGNED, deliberately -- batch_size_scheduling.  Upstream ramps the batch
; per epoch (0/16, 2/24, 5/32, 10/64, 20/128, 40/9999, realised as 16/24/32/64
; because min(b, bs) caps it), at unchanged LR.  This port keeps a fixed batch
; because the operator runs a fixed 32.  Adding the ramp would change the
; gradient variance mid-run, which is a training-recipe decision, not an
; alignment fix.  See UPSTREAM_ALIGNMENT.md row 16.
epoch_size = 0
device = cuda
mmap_block_size = 256
; --mmap 時以區塊為單位 shuffle，避免大型 shard 的隨機 page fault
mmap_num_workers = 2
prefetch_factor = 2
; shared server 的低 RAM 預設；可依儲存裝置與 CPU 再微調

[multi_res_spec_loss]
fft_sizes = 256,512,1024,2048
; Absolute sample counts at 48 kHz -- these need NO re-derivation for the
; 1024/512 grid, and they match upstream's shipped list exactly.
gamma = 0.3
factor = 500
factor_complex = 500
; Gamma-compressed magnitude + complex MSE, summed over all resolutions.
; ⚠ Same factor as upstream, but NOT the same objective scale.  Upstream's loss
; STFT sees waveforms at 1/sqrt(960) = 0.0323x true amplitude (its analysis
; applies wnorm and its ISTFT does not undo it); this port's matched sqrt-Hann
; round trip is unity gain (1.0 to 8e-17).  With gamma = 0.3 that makes the
; nominal objective 960^0.3 = 7.85x upstream's.
; ⚠ Do NOT "fix" this by scaling factor by 960^-0.3.  AdamW is scale-invariant in
; the relevant regime and clip_grad_norm_ rescales without changing direction, so
; the EFFECT is unestablished -- any change here is a tuning experiment with a
; grad_clip interaction, not a port correction.  See UPSTREAM_ALIGNMENT.md row 18.

[paths]
output_dir = ./output
; dataset_gen --sample-rate 48000 output:
; packed_dir = /path/to/generated/data_48k/packed.pt
; or override with --packed-dir CLI arg
