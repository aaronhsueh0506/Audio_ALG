[signal]
sr = 16000
n_fft = 512
win_len = 512
hop_len = 256
; Root Hann window (COLA-compliant 50% overlap)

[model]
erb_subband_1 = 65
erb_subband_2 = 64
; ERB filterbank split: first erb_subband_1 bins kept raw,
; remaining bins mapped to erb_subband_2 ERB bands.
; Total input F = erb_subband_1 + erb_subband_2 = 129.
; DPGRNN width = 33 (derived automatically from encoder strides).

[training]
epochs = 100
batch_size = 16
; GTCRN paper §3.2 uses batch 16 for DNS3.
; (An earlier comment here claimed batch_size >= 2 was required for
;  BatchNorm2d.  That is false: BatchNorm2d normalises over (N, H, W), so a
;  batch of 1 still has T*F values per channel.  Verified by running a
;  forward+backward at batch=1.)
lr = 1e-3
min_lr = 1e-6
lr_warmup = 1e-4
warmup_epochs = 3
grad_clip = 5.0
; Per-step linear warmup (lr_warmup → lr over warmup_epochs) then cosine
; annealing to min_lr, matching the other AINR trainers.  The paper's
; ReduceLROnPlateau was replaced because it compares against the best epoch ever
; seen: one improved epoch resets the counter, and a measured run sat at 1e-3
; for 32 epochs without ever halving.  The LR trajectory is part of the bake-off
; protocol, so it must not differ between the models being compared.
; grad_clip keeps the previous hard-coded 5.0, now configurable.
early_stop_patience = 20
epoch_size = 0
; 0 = use every training sample per epoch.  DIVERGES from GTCRN paper §3.2,
; which draws 40,000 noisy-clean pairs per epoch out of DNS3 -- that number is a
; fraction of THAT corpus, and carrying it over to a differently-sized corpus
; would mean "one epoch" covers an arbitrary slice of it.
; A non-zero value is capped at len(train_set), so a smaller corpus falls back
; to "use all" anyway.
; ⚠ RNNoise-ERB must use the SAME per-epoch sample count, otherwise
;   "100 epochs" means two different amounts of gradient and the two models
;   are not comparable.
device = cuda
mmap_block_size = 256
; --mmap 時以區塊為單位 shuffle，避免大型 shard 的隨機 page fault
mmap_num_workers = 2
prefetch_factor = 2
; shared server 的低 RAM 預設；可依儲存裝置與 CPU 再微調

[paths]
output_dir = ./output
; packed_dir = /path/to/data   ; override with --packed-dir CLI arg
