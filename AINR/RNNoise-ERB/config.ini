[signal]
sr = 16000
n_fft = 512
; win_len 和 hop_len 為 optional:
;   win_len 預設 = n_fft
;   hop_len 預設 = win_len // 2 (50% overlap → root Hann COLA 完美重建)
; 當 win_len < n_fft 時，自動 zero-pad 到 n_fft 做 FFT
; 取消註解可自訂:
; win_len = 320
; hop_len = 160
; --- Hybrid bands (ref: GTCRN) ---
; hybrid_cutoff_hz > 0 時啟用: cutoff 以下用原始 FFT bins, 以上用 ERB bands
; n_bands 由 hybrid 計算自動決定 (cutoff_bin + n_erb_high_bands)
; 設 hybrid_cutoff_hz = 0 時退回純 ERB 模式，使用 n_bands
hybrid_cutoff_hz = 0
n_erb_high_bands = 0
; hybrid 暫時關閉，使用純 ERB 模式 (n_bands = 32)
n_bands = 22
; (純 ERB fallback, hybrid 模式下此值被忽略)
min_bins_per_band = 2
; 每個 ERB band 至少幾個 FFT bin (greedy-forward 保證, DFN3 風格)。
; 改動會改變 band 邊界 → 改變 ERB 濾波器矩陣 → 必須重生 C 表並重訓。
; 先前寫死在 train.py 三處與 gen_rnnoise_tables.c，無漂移守衛；
; 現由 process.h RNNOISE_MIN_BINS_PER_BAND 鏡射並由合約測試比對。
; (test_rnnoise_tables.c 刻意保留自己的獨立常數 —— 它是第二來源守衛。)
lookahead_frames = 1
; 往後看幾個 frame (0 = causal, 1 = 1-frame lookahead)
; conv1 k=3 + lookahead=1 = 置中 3-tap (1 過去 + 當前 + 1 未來), 延遲 = 1 hop ≈ 16ms (16k/hop256)
; lookahead=1 會增加 hop_len 的延遲，但對 transient (e.g. 引擎轉速上升) 有幫助
; 訓練和推論必須使用相同設定 (改此值需重訓; 舊 lookahead=0 checkpoint 不相容)

[feature]
version = log_erb_dfn_mean_cplx_unit_0_4k_v8
; DeepFilterNet 原作者 libDF band_mean_norm_erb:
;   mean = alpha*mean + (1-alpha)*erb_db; feature=(erb_db-mean)/40.
; 不另外加 absolute-level input。complex preprocessing 仍保留部分 level 資訊，
; 但只有 [model] use_complex_input=true 時網路才會實際使用；出貨預設為 false。
;
; alpha 有兩種指定方式，二選一：
;   (a) erb_norm_alpha / spec_norm_alpha > 0  →  直接固定 per-FRAME 衰減率
;   (b) 留 0（或不設）                        →  由 tau 導出（上游 libDF 的作法）
;
; 本專案採 (b)，tau = 1 s。理由是「秒不變性」：正規化器追蹤的是訊號在時間上的
; 統計性質，那與分析 hop 無關，所以固定物理時間常數才是格點無關的策略。上游
; df/utils.py 的 _calculate_norm_alpha(sr, hop, tau) 正是如此 —— 0.99 是它在
; 10 ms 幀長下算出來的結果，不是一個該被照抄的常數。
;   16k / hop 256 → alpha = 0.984      (本設定)
;   48k / hop 512 → alpha = 0.989      (DeepFilterNet2 目錄，已是此作法)
;
; 曾短暫改為固定 alpha=0.99 取「幀不變性」，但那讓記憶變成 100 幀 = 1.59 s，
; 3 秒片段（186 幀）結束時初始值仍殘留約 15%，等於每一幀都落在 init 主導的
; 暫態裡，使 init 校準從「加分」變成「必要」。
; 改回 tau 導出後殘留量從 15.2% 降到 4.9%（3 秒 = 187.5 幀），好三倍但仍不是零
; ——3*tau 恰好等於片段長度，所以 init 校準依然值得做，只是不再是硬需求。
erb_norm_tau_sec = 1.0
erb_norm_init_lo_db = -20
erb_norm_init_hi_db = -45
; v8: 在實際 16k 語料（228000 clips 的 training split、量測 2000 clips）上校準。
; libDF 的 -60/-90 是為它自己的矩形/能量平均 filterbank 定的，對我們的三角/
; 重疊/加總 bank 偏了 +35~+48 dB。擬合值為 -24.5/-41.9，取整到 -20/-45 只多付
; 0.67 dB RMS（fit 自身殘差已是 4.0 dB），換得可讀的常數。
; ⚠ 逐帶殘差 4.03 dB = 斜坡跨度的 23%：真實頻譜在 band 3 附近有峰，直線畫不出
;   峰。這兩個數字拿掉了九成的系統偏差，但不是剖面的好描述。
erb_norm_scale_db = 40.0
; Complex branch 取 0..4kHz（512 FFT @ 16kHz = 129 bins）。
spec_max_hz = 4000
; DeepFilterNet 原作者 libDF band_unit_norm: 每個 complex bin 用自己的
; magnitude 更新 EMA state，再以 sqrt(state) 正規化 real/imag。
spec_norm_tau_sec = 1.0
spec_norm_init_lo = 0.04
spec_norm_init_hi = 0.008
; 這兩個是線性 magnitude，模型做 x/sqrt(state)，所以誤差是乘性的 —— 不能像
; dB 那樣隨意取整。實測端點 0.03669/0.008161，取到 1 位有效數字後逐 bin 特徵
; 偏差僅 0.96~1.01x；若取成 0.1/0.001 則偏差 0.61~2.86x。
; ⚠ 用的是「實測端點」而非擬合端點：per-bin magnitude 剖面是凸形非單調，
;   最小平方直線會在末端穿過零，而負值會讓 x/sqrt(state) 變成 NaN。
spec_norm_eps = 1e-12
; v4: 拿掉 v3 額外保留的 erb_norm_clip(±5)/spec_clip(±10) 部署安全界線 --
; 對照過 Rikorose/DeepFilterNet libDF/src/lib.rs 的 band_mean_norm_erb/
; band_unit_norm 以及本 repo 自己的 AINR/DeepFilterNet2 port,兩者皆無
; clip,故此改動是精確對齊原作公式,非疏漏。
; v5: erb_bandborder() 的 band 最小寬度保證改成嚴格 greedy-forward(每個
; band 保證 >=2 bin),取代 aaronhsueh0506/DeepFilterNet-Keras notebook
; ERBBand() 原本「每隔一個 band 補 2」的規則 -- 該規則實測在
; sr=16000/n_fft=512/n_bands=22 時仍會產生寬度僅 1 bin 的 band。這會改變
; erb_fwd/erb_inv 矩陣,train.py/process.h/gen_rnnoise_tables.c 三邊同步。
; 這些常數也固定在 process.h；修改需同步 C 並重訓。

[paths]
output_dir = ./output

[model]
; RNNoise 容量 (官方 v0.2 = cond_size 128 / gru_size 256)。
; ERB temporal conv 送入 gru_size；只有 use_complex_input=true 時才會另外建立
; complex frequency encoder，並在進 GRU 前與 ERB embedding fusion。
; 3 層 GRU 皆 gru_size。改這裡 train + denoise 自動同步 (存進 ckpt)。
cond_size = 64
gru_size = 128
use_complex_input = false
; false = 純 ERB：輸入只有 22 個 ERB 帶，輸出只有 22 個實數 gain。
; 模型的輸出本來就是 22 個實數 band gain，所以複數分支學到的帶內結構在輸出端
; 全部被丟掉 —— 它花 46,952 params (12.5%) 去萃取 0–4 kHz 的細節，而粗輸出
; 表達不了。關掉之後模型兩端都是純 ERB，與 GTCRN（混合解析度輸入 + 複數
; mask）形成乾淨的兩個極端，比較才有歸因意義。
; 設 true 可還原雙路徑（下面兩個參數才生效）。
; ⚠ 推論端（inference.py / export_onnx.py）不讀這個鍵，而是直接看 checkpoint
;   裡有沒有 spec_* 權重 —— 避免 config 與 checkpoint 不一致。
spec_conv_channels = 8
spec_embed_size = 64

[training]
epochs = 100
batch_size = 128
lr = 3e-4
device = cuda
epoch_size = 0
; 每 epoch 隨機抽取的 sample 數 (0 = 全部跑完)。
; ⚠ 必須與 GTCRN/config.ini 的 epoch_size 相同，否則「100 epochs」在兩個模型
;   上代表不同的梯度量，bake-off 的結果就無法歸因於模型本身。
;   0 偏離 GTCRN paper §3.2 的 40,000（DNS3 每 epoch 隨機抽 40,000 對）：那個
;   數字是相對於「那個語料」的比例，換到不同大小的語料上，「一個 epoch」就變成
;   涵蓋語料的任意一部分。非零值都會被 len(train_set) 封頂。
mmap_block_size = 256
; --mmap 時以區塊為單位 shuffle，避免大型 shard 的隨機 page fault
mmap_num_workers = 2
prefetch_factor = 2
; shared server 的低 RAM 預設；可依儲存裝置與 CPU 再微調
dropout = 0.05
; GRU 層間 dropout
weight_decay = 1e-12
; AdamW weight decay 起始值。DFN 用 1e-12 (≈0) 起步
weight_decay_end = 0.01
; DFN-style wd 排程: cosine 從 weight_decay → weight_decay_end (DFN3=0.01, DFN2=0.05)。
;   設 -1 = 關閉排程, 用常數 weight_decay。⚠ 有效衰減=lr·wd, 全程極小 (DFN 實質幾乎不正規化)
min_lr = 1e-6
; cosine annealing 最小 lr (eta_min)
grad_clip = 1.0
; clip_grad_norm_ 的上限；先前寫死在 train.py 內。
lr_warmup = 3e-6
; linear warmup 的起始 lr。共用的 scheduler factory 由 lr_warmup / lr 推出
; start_factor，所以這是先前寫死的 start_factor = 0.01 的顯式寫法
; (3e-4 x 0.01 = 3e-6)。⚠ 不是逐位元相同：3e-6/3e-4 在 double 下是
; 0.010000000000000002 而非 0.01，warmup 段的 lr 差 1 ULP（相對 2.2e-16，
; 只在前 warmup_steps 步）。schedule 的形狀（clamping、milestone、T_max）
; 已驗證完全相同，差的只是十進位字面值的浮點表示。
; ⚠ 改 lr 時要一起改這裡，否則 warmup 的起點會跟著 lr 等比例移動。
warmup_epochs = 3
; linear warmup epochs (DFN2 default = 3)
early_stop_patience = 20
; val loss 連續 N epochs 沒改善就停訓

[multi_res_spec_loss]
; DeepFilterNet 3 production MultiResSpecLoss.  Currently DISABLED (both
; factors 0), so the ERB-IRM term below is the entire objective.
fft_sizes = 128, 256, 512, 1024
; = {n_fft/4, n_fft/2, n_fft, n_fft*2} at n_fft=512 -> 8/16/32/64 ms @16k.
; Upstream DeepFilterNet3 ships 256,512,1024,2048 against ITS model FFT of
; 960, i.e. the same {f/4, f/2, f, f*2} ratios rounded to powers of two.
; Copying those integers verbatim to a 512-point model (as this config did)
; shifts the whole set one octave up to {f/2, f, f*2, f*4} = 16/32/64/128 ms,
; leaving no resolution below 10 ms and adding a 128 ms term that dominates
; the (summed, not averaged) total.
gamma = 0.3
; magnitude 與 complex spectrum 都先做 |X|^gamma compression 再算 MSE。
factor = 0
factor_complex = 0
; 兩者皆 0 = 關閉 MRSL，objective 只剩下面的 [erb_irm_loss]。
; 為什麼關掉：實測 3 秒樣本上 d(MRSL)/d(gains) 的 RMS 是 d(IRM)/d(gains) 的
; 1106 倍（1.262e-01 vs 1.141e-04），所以「MRSL + IRM 併用」在梯度上其實就是
; MRSL-only —— IRM 項存在但不影響最佳化。既然目標是用 IRM 訓練，就讓它成為
; 唯一的 objective，而不是掛一個沒有作用的項。
; 要恢復併用：把 factor/factor_complex 設回 500，並依實測 gradient norm 調整
; [erb_irm_loss] factor（等量級約需 1.1e3），否則會退回同樣的失衡。
; fft_sizes/gamma 保留，關閉時不參與計算。

[erb_irm_loss]
; The whole training objective.  Direct MSE between the model's 22 band gains
; and the ideal ratio mask, in a gamma-compressed domain.
factor = 1.0
gamma = 0.5
; Compression applied to both predicted and target gain before the MSE.
; = original RNNoise paper's perceptual compromise.  Smaller gamma approaches
; log-gain error and tends toward more aggressive suppression.
energy_floor = 1e-9
; Undefined-band mask: bands whose MIXTURE energy is below this carry no
; usable ratio, so they are excluded rather than contributing noise gradient.
;
; 沒有 activity_weight / vad_threshold_db。先前有一個 (1 + 5*vad) 加權，是比照
; xiph/rnnoise 加的 —— 但 xiph 的 vad 來自模型真正的 VAD 輸出頭並有獨立的 VAD
; loss，我們的模型只輸出 22 個 band gain、沒有 VAD head，等於在替一個網路不
; 預測的量加權。而且它在最關鍵的情況下方向相反：純噪音樣本 clean 能量為 0、
; 峰值參考被 clamp 到 1e-12，10*log10(0/1e-12) 算出 0 dB 高於門檻，於是每一個
; 純噪音幀都被判為 speech-active 並被放大 6 倍。已移除。
