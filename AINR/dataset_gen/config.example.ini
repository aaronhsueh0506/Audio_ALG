; ============================================================
; AINR dataset generation config
;
; This file only configures gen_dataset.py / DNS4Dataset WAV-pair generation.
; Model architecture, FFT/ERB features, optimizer, training, and loss settings
; belong in each downstream model's own config and intentionally do not appear
; here.
; ============================================================

[signal]
; 每次只產生一種 sample rate。gen_dataset.py 未傳 --sample-rate 時使用此值；
; CLI 可覆寫。RNNoise-ERB/GTCRN 設 16000，DeepFilterNet2 設 48000。
sr = 48000

[paths]
speech_dir = /path/to/dns4/clean_speech
noise_dir = /path/to/dns4/noise
rir_dir = /path/to/dns4/impulse_responses
; (output location is NOT configured here — gen_dataset.py --output, default "data")

[audio]
segment_sec = 3.0

[gen]
start_idx = 0
; gen_dataset 起始檔名索引 -- 只適用於全新/空的 --output 目錄 (例如替一個
; 獨立的新 shard 編號，避免跟其他 batch 的檔名撞在一起)。
; 注意: 對「已經有樣本」的 --output 目錄，start_idx 一律不能用來擴增/接續 --
;       CLI 會直接拒絕執行 (即使指定了不同的 start_idx)，因為那樣會讓一部分
;       檔案沿用舊的 config/seed、一部分沿用這次的新設定，而 meta.json 只會
;       記錄最新這次的設定，造成整批資料的 config 記錄不實。
; 擴增既有 dataset (不洗掉舊檔) 請一律改用: --resume --hours <新的總時數>
;       (--hours 是這批資料完整生成後的目標總時數, 不是這次要「新增」的時數)
; 注意: effective_seed = seed + start_idx (見下方 seed 說明)。--resume 不會
;       自動調整 start_idx，若使用固定 seed (非 -1) 多次 --resume 同一批次，
;       每次的 effective_seed 相同，augmentation 隨機流也會重複；預設
;       seed = -1 (每次都是全新 OS random seed) 則不受影響。
seed = -1
; -1 = 每次啟動從 OS 取得新的 random seed（預設，實際 seed 會印出並寫入 meta.json）
; >= 0 = 固定 seed，可重現同一次設定/環境下的 dataset；CLI --seed 優先。
; Optional: limit the number of speech files considered in each shuffled pass.
; 0 (default when omitted) = use every speech file.
; pass_size = 0
; Optional: 'train' (no-op, default when omitted) or 'validation' -- a
; 'validation' run force-zeroes both [augmentation] clipping knobs below,
; matching DFN3's train-only clipping (see README.md "Clipping distortion").
; generation_split = train

[mixing]
; DeepFilterNet2/3 的離散 SNR 值；mixed samples 會等機率抽一個值。
; DFN3 config 另外用 -100 sentinel 代表 pure noise；本生成器改用下方
; noise_only_p 明確控制，不把 -100 混入一般 SNR。
; 與 DeepFilterNet mix_audio_signal 相同，SNR 以 clean target RMS 為基準，
; mixture 中則放入 full-RIR reverberant speech。
; 2026-08 擴充：加入 -15/-10 兩個更嚴苛的低 SNR 值。
snr_values = -15, -10, -5, 0, 5, 10, 20, 40

; DNS-style target-level normalization (ref: DNS Challenge
; noisyspeech_synthesizer_singleprocess.py 的 target level 抽樣)。
; 'dns_target_level' 是目前唯一實作的 mode；dataset.py 會在讀到其他值時直接
; raise，不會靜默忽略打字錯誤。
level_mode = dns_target_level
; noisy/target 一起、用同一個係數縮放，使 noisy 混音的 RMS 命中一個
; [target_level_min_db, target_level_max_db] 之間均勻抽樣的 dBFS 值——
; 覆蓋原本「音量完全由 speech/noise 素材原始電平決定」的行為，讓資料集涵蓋
; 真實部署會遇到的大動態範圍（近講大聲/遠講小聲的麥克風錄音）。抽樣與套用
; 都發生在 dataset.py 的 resample-simulation 步驟「之後」，避免 48→16 kHz
; 之類的後續 resample 讓量到的 level 跟實際送進模型的 level 產生落差。
target_level_min_db = -40
target_level_max_db = -10

[rir]
p_rir = 0.5
; 套用 RIR 機率。DFN3 production 是 0.1；2026-08 提高到 0.5 是本專案自己的
; 選擇（比上游更常見的殘響曝光），不是對齊上游。
rt60_min = 0.2
rt60_max = 1.0
; 秒, Schroeder 積分法估算 (DFN3 sampler 範圍)
early_rir_ms = 20.0
; late offset (ms): peak + 此值之內 target 保留, 之後依 RT60 指數衰減 (DFN3 風格)
pre_delay_keep_ms = 1.0
; peak 前保留的 delay (ms)
drr = 0.3
; DeepFilterNet with_drr 的 0..1 線性 blend factor（不是 dB）:
; target = drr · dry + (1-drr) · early_reverb_speech，原作者預設 0.3。
; dry 會先 delay 到 trimmed RIR 的 direct-path peak，避免 target/noisy 時間錯位。

[noise]
max_noise_mix = 1
; ⚠ 這與 DFN3 出貨行為不同，而且原本的理由是誤讀。
; DFN3 每個樣本混 `n_noises = rng.uniform(2,6)` → 恆 2~5 種噪音，無條件執行
; (dataset.rs:1253-1254)。`p_interfer_sp` 控制的是「干擾說話者」不是噪音混合數，
; 拿它當「DFN3 沒做多噪音混合」的依據是錯的。
; 保持 1 = 比上游更窄、更穩態的噪音分佈；這是能力落差不是穩定性問題。
; 對齊需改 dataset.py 的 _load_noise 疊加邏輯。
noise_only_p = 0.05
; 純噪音樣本機率：noisy=noise, target=silence。
; ⚠ 上游是 14.3%：DFN3 把 snr = -100 當 sentinel 混進 snr_values，等機率 1/7
;   抽中 (dataset.rs:1218,1227-1228)。我們是 0.05，少了 2.9 倍。
; ⚠ 這與 DeepFilterNet2 的梯度尖峰風險有關，但機制不是「全零 target 本身危險」：
;   _SafeAngle 的梯度增益是 |x|/max(|x|²,1e-10)，最大值 1e5 發生在 |x|=1e-5，
;   x=0 時增益反而是 0。全零 target 的作用是把預測的 magnitude 一路壓 *穿過*
;   那個 1e-5 的危險帶（γ=0.3 下實際被拉向 1e-12^0.3 = 2.51e-4）。
;   少見但無防護比常見有防護更難查 —— 見 DeepFilterNet2/UPSTREAM_ALIGNMENT.md §3。
speech_only_p = 0.05
; 純語音 identity 樣本機率：noisy=target，避免模型沒看過真正無噪輸入。
; noise_only / speech_only 互斥；其餘 90% 才從 snr_values 取樣混噪。

[augmentation]
; --- RandBiquadFilter ---
; 分別套用在 speech 和 noise (混合前, 獨立隨機參數)
; ⚠ 這裡的 0.5 不是上游的值，先前的 `(ref: DeepFilterNet)` 標註是錯的：
;   DFN3 出貨時 DF_P_BIQUAD 未設 → 實際 p_biquad = 0.0 (dataset.rs:652,697)，
;   biquad 在上游是關掉的。0.5 是本專案自己的選擇。
; ⚠ 代價：每個樣本最多多出 ~45 dB 的頻譜傾斜，上游完全沒有。這會直接放大
;   ERB / complex EMA 正規化器要吸收的動態範圍，與 DeepFilterNet2/config.ini
;   [feature] 那組重新校準的 norm-init 端點互相耦合 —— 動這個值就要重跑
;   calibrate_norm_init.py。
; ⚠ 上游真正開著的兩個頻譜 augmentation 我們都沒有：RandRemoveDc (p=0.25) 與
;   RandLFilt (p=0.25)，speech 和 noise 兩條鏈都掛 (dataset.rs:644-651)。所以
;   本專案的頻譜 augmentation 分佈與上游「不相關」，不只是強度不同。
p_biquad = 0.5
n_biquad_filters = 3
; 每次最多幾個 biquad filter
biquad_gain_db = 15.0
; ±gain 範圍 (dB)
biquad_q_min = 0.5
biquad_q_max = 1.5
; 6 種 type: LowPass, HighPass, LowShelf, HighShelf, PeakingEQ, Notch
; 頻率範圍依 type:
;   LowPass 4-8kHz, HighPass 40-400Hz, LowShelf 40-1000Hz,
;   HighShelf 1-8kHz, PeakingEQ 40-4000Hz, Notch 40-4000Hz

; --- Lower-rate source upsample simulation ---
; 模擬實際音源原本是較低 SR，為了送進 16/48 kHz 演算法才 upsample。
; noisy 與 target 走完全相同的 downsample→upsample，不做 bandwidth extension。
p_resample = 0.1
; 套用機率；請依部署端低 SR 音源的實際比例調整。
; ⚠ 同名同機率，但與上游是不同的 augmentation。上游 p_resample 是 time-scale /
;   pitch 隨機重取樣 (augmentations.rs:458-465)；這裡是低 SR 音源模擬。
;   淨結果：本專案沒有 time-scale/pitch augmentation，上游沒有 bandwidth-limiting
;   augmentation。不要把語意換成上游的而不補回另一邊。
source_sr_values = 8000, 12000, 16000, 22050, 24000, 32000, 44100
; 只會從小於 [signal] sr 的離散值抽樣：
;   algorithm sr=48000 → 使用完整列表
;   algorithm sr=16000 → 自動只保留 8000, 12000

; --- Clipping Distortion ---
; 兩個獨立機率，混合前/混合後分開控制（target 皆不變，只失真 noisy 側）：
;
; p_noise_clipping — 混合「前」，套在 noise 鏈本身（noise_only 樣本的 noisy
; 就是這個 noise；mixed 樣本則是這個 noise 依 SNR 縮放後再疊加進 mixture）。
; 對齊 DFN3 的實際（config 看不到的）行為：上游在 Split::Train 時直接把
; RandClipping::default_with_prob(0.1).with_c(0.01..0.5) 掛到 *noise* 鏈上
; (dataset.rs:705-709)，完全繞過 config —— 所以上游訓練用的噪音有 10% 是先
; 被硬削波再混入的。本專案沒有 train/val split 這個概念（split 在下游各
; model 的 train.py 才發生，此生成器產出的所有樣本一視同仁），所以這裡無條件
; 對每個樣本套用，不分「只在 train」。
p_noise_clipping = 0.10
;
; p_mixture_clipping — 混合「後」（在 DNS-style level normalization 之後），
; 套在最終 noisy 混音上。這是原本單一 p_clipping 的行為與語意，只是改名以
; 對稱新增的 p_noise_clipping；預設關閉。
p_mixture_clipping = 0.0
;
; 兩者共用同一組削波強度範圍：
clip_snr_min = 0
clip_snr_max = 20
