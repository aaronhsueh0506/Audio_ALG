<p>從音訊進入點選擇整合方式。已有多聲道 AEC 或自己的 FFT 時，可直接使用對應的頻域介面。</p>

<dl class="choices">
<dt><a href="start/index.html">建置與第一次執行</a></dt><dd>取得相依庫、編譯 mono 範例，處理一組 mic／far WAV。</dd>
<dt><a href="pipelines/index.html">選擇 pipeline</a></dt><dd>從 mono 或四聲道選擇傳統 NR、DFN2 或 Align-ULCNet。</dd>
<dt><a href="models/index.html">模型開發與部署</a></dt><dd>比較八個模型的 C／PCM 入口，查訓練、ONNX 與加速器接線。</dd>
<dt><a href="libraries/index.html">底層函式庫</a></dt><dd>AEC、NR、audiolib 的獨立首頁，以及各自負責的訊號處理。</dd>
