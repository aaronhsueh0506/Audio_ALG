; ============================================================
; AECNet -- standalone AI acoustic echo canceller (stage 1)
;
;   in : Y (microphone) + X (far-end reference), complex spectra
;   out: D_hat, the ESTIMATED ECHO
;   then E = Y - D_hat, by SUBTRACTION, outside the model.
;
; ⚠ The network's target is the ECHO ITSELF. It does not emit enhanced speech
;   and it does not emit a mask on the microphone. A mask on Y would make one
;   network do cancellation, residual suppression and noise reduction at once,
;   and nothing measured afterwards could be attributed to any of them.
;
; ⚠ Every time constant here is in SECONDS. A 48 kHz variant is a [signal]
;   change and NOTHING ELSE (but read the ⚠ on gru_groups first).
; ============================================================

[signal]
sr = 16000
n_fft = 512
win_len = 512
hop_len = 256
; sqrt-Hann (periodic), 50% overlap, COLA. n_freqs (257) and frame_rate
; (62.5 fps) are DERIVED by dataset_gen/aec/AecGrid -- do not restate them, and
; do not write a frame count anywhere.
; ⚠ hop_len MUST be win_len/2; AecGrid rejects anything else, because sqrt-Hann
;   analysis + sqrt-Hann synthesis sums to unity only at 50% overlap.
; The 48 kHz variant: sr = 48000, n_fft = 1024, win_len = 1024, hop_len = 512.

[model]
channels = 16, 32, 48, 64
; One strided encoder stage per entry, mirrored in the decoder. Frequency is
; halved per stage: 257 -> 129 -> 65 -> 33 -> 17 at 16 kHz.
; Widening the last entry is the expensive edit -- it multiplies the bottleneck
; width, and the bottleneck is ~92% of the parameters.

kernel_t = 2
kernel_f = 5
; Time kernel 2 = the current frame plus one of history per layer, which with 4
; encoder + 4 decoder stages gives the convolutional path 8 frames (128 ms) of
; context before the GRU adds unbounded memory.
; ⚠ kernel_f must be ODD. An even frequency kernel makes the decoder's
;   transposed conv land one bin away from the encoder width it has to match,
;   and the skip connection would be silently cropped rather than rejected.

stride_f = 2

gru_layers = 2
gru_groups = 8
; Grouped GRU bottleneck (CRUSE). The feature vector is channels[-1] * 17 =
; 1088 wide here; a full GRU on it costs ~14 M parameters by itself, so the
; grouping is what keeps the model inside its 1-3 M budget.
; ⚠ channels[-1] must be divisible by gru_groups -- the split is channel-major,
;   so a group boundary has to fall on a channel boundary.
; ⚠ AT 48 kHz THIS IS THE KNOB TO REVISIT. n_freqs 513 leaves 33 encoder bins
;   instead of 17, so the bottleneck doubles to 2112 and the GRU cost roughly
;   QUADRUPLES to ~6.7 M. Add a fifth encoder stage (channels = 16, 32, 48, 64,
;   64) or raise gru_groups to 16 before assuming the 16 kHz size carries over.
;   The signal grid is config-only; the parameter budget is not.

lookahead_sec = 0.0
; Future context in SECONDS, on top of a strictly causal core. Converted to
; whole frames by dataset_gen.aec.frames_from_seconds, so the same value buys
; the same ACOUSTIC latency at 16 and 48 kHz. ⚠ Never state this in frames:
; "2" would be 32 ms here and 21 ms on the 48 kHz grid, i.e. a different model.
; ⚠ Non-zero lookahead DELAYS THE OUTPUT by that many frames -- output frame i
;   then corresponds to input frame i - lookahead. That is the only convention
;   that is also correct when the input arrives in chunks. The loss and
;   denoise.py both realign for it; anything else that consumes D_hat must too,
;   or it subtracts an echo estimate from the wrong microphone frame.
;   0.016 here is one frame, i.e. 16 ms of added latency at this grid.

compress_exponent = 0.3
; The model reads, writes AND is scored in the |Z|^0.3 domain (phase untouched).
; 0.3 is the DeepFilterNet/GTCRN value the sibling projects already use, so the
; loss scales are comparable across this repo.
; ⚠ ONE exponent, shared by the features, the output and the loss. Because the
;   network predicts compressed values, L_echo is a plain MSE on the network's
;   own output. Compressing only inside the loss would insert a c-th root
;   between the parameters and the objective and put back the 80 dB dynamic
;   range the compression exists to remove.
;   Changing this invalidates every checkpoint (it is in the contract).

[training]
epochs = 100
batch_size = 8
; ⚠ batch_size IS THE NUMBER OF LANES. Lane k of batch b+1 carries the NEXT
;   chunk of the sequence lane k carried in batch b, so the recurrent state is
;   valid across the batch boundary and a whole 20-60 s sequence is seen
;   unbroken. Every lane needs its own sequence, so batch_size may not exceed
;   the number of sequences in the split (the trainer clamps and says so).

lr = 1e-3
min_lr = 1e-6
lr_patience = 4
; ReduceLROnPlateau fires on the (patience + 1)-th consecutive bad epoch, so 4
; means "halve after 5 epochs without improvement". Matches GTCRN/config.ini;
; do not "correct" it to 5.
early_stop_patience = 20
grad_clip = 5.0

steps_per_epoch = 0
; 0 = a full pass. ⚠ Any non-zero value truncates every epoch at the same point
;   in every lane, and because each lane always starts a sequence at chunk 0,
;   only the FIRST steps_per_epoch chunks of any sequence are ever seen. Late
;   chunks -- which is where drift and post-echo-path-change recovery live --
;   become invisible. Use it to smoke-test, not to train.

num_workers = 2
prefetch_factor = 2
; ⚠ Each worker holds its own copy of the packed shards unless --mmap is used,
;   so this multiplies RAM by (num_workers + 1). Use --mmap on a big corpus.
device = cpu

; ---------- loss ----------
; L = L_echo(D_hat, D)
;   + lambda_out  * L_output(Y - D_hat, S + N)
;   + lambda_near * near_end_preservation
;   + lambda_idle * ||D_hat|| on frames where the reference is inactive
echo_norm = l1
; Distance used for L_echo ONLY (L_output always uses l2).
;   l1 -- mean absolute error on the compressed complex difference
;   l2 -- squared error
; ⚠ This is not a tuning knob, it is a known failure mode. Braun & Valero
;   (IWAENC 2022), the source of the echo-target + subtraction design this
;   project follows, state: "using compressed spectral distances similar to (4)
;   for the echo component results in significant under-estimation of the echo.
;   Therefore, we propose to use the mean absolute error (MAE), which provides
;   accurate echo estimates."
; ⚠ Under-estimation is the one failure this stage cannot afford: a
;   systematically small D_hat leaves more residual for stage 2 while every
;   stage-1 metric still looks reasonable, so the cost surfaces two projects
;   downstream. Set l2 only to reproduce the v1 objective deliberately.
mag_weight = 1.0
; Weight of the magnitude-only MSE inside L_echo and L_output, relative to the
; complex MSE. ⚠ Do not set to 0: a complex MSE alone is minimised by shrinking
; |D_hat| toward zero wherever the phase is uncertain, which is exactly the
; shape of "the canceller does nothing".

lambda_out = 1.0
; Scores E = Y - D_hat against S + N. The only term in which the subtraction
; appears; the network still never has S + N as its own target.

lambda_near = 0.5
; ASYMMETRIC near-end preservation: penalises only the DEFICIT
; relu(|S+N|^c - |E|^c) on frames where the near talker is active, i.e. energy
; REMOVED from the near path -- never energy left behind.
; ⚠ The asymmetry is the point. Residual echo left in E can still be removed by
;   a downstream residual suppressor; near speech this stage has already
;   cancelled is gone and nothing downstream can restore it. A symmetric term
;   prices an irreversible loss the same as a recoverable one.

lambda_idle = 1.0
; Compressed energy of D_hat on idle frames. This is what makes
; "reference silent => produce no echo estimate" TRAINABLE, and it is what the
; zero-reference hard gate below tests. Its supervision comes from the
; 'ref_dropout' and 'near_only' scenarios, where X == 0 and D == 0 exactly.
; ⚠ If ref_dropout is a negligible share of the corpus this term is weighted
;   noise. The trainer prints the share and warns below 1%.

idle_guard_sec = 1.5
; A frame counts as idle only after the reference has been CONTINUOUSLY silent
; for this long.
; ⚠ LOAD-BEARING, and the single most likely thing to get wrong here. Without
;   the guard every brief pause in far-end speech is labelled idle, and the
;   model is punished for the echo TAIL that is still physically arriving --
;   i.e. trained to truncate reverberant echo, which is the opposite of its job.
;   1.5 s covers the corpus's rt60_max of 1.2 s with margin. Raise it if the
;   RIR set gets more reverberant; lowering it below rt60_max trains tail
;   truncation.
; ⚠ THE GUARD EATS THE FRONT OF EVERY IDLE STRETCH. At the generator's
;   chunk_sec = 4.0 a fully-silent chunk yields 250 - 94 = 156 idle frames, but
;   a chunk shorter than the guard yields NONE and the idle term is silently
;   unsupervised. The trainer prints the idle-frame count each epoch and warns
;   when it is zero -- believe the warning; it means chunk_sec is too short for
;   this guard, or ref_dropout is absent, not that the term is converged.

far_active_dbfs = -60
near_active_dbfs = -50
; Per-frame dBFS thresholds for "the far end is talking" / "the near end is
; talking", measured on the WAVEFORM (a dBFS threshold against an STFT
; magnitude would be meaningless -- that carries the window gain).
; The generator scales every stem to at least -40 dBFS active level, so -60 is a
; silence floor rather than a speech detector; a reference dropout is exactly 0
; and lands at -200 dB.

zero_ref_leak_db_max = -40
; ⚠ THE HARD GATE. With X == 0 the model must emit essentially no echo estimate,
;   so that E = Y - D_hat degenerates to Y and the canceller is provably
;   transparent when there is nothing to cancel. Reported every epoch and
;   assertable with model.assert_zero_reference_gate(). -40 dB means the damage
;   done to a signal that needs no cancellation is 40 dB below it.

[paths]
output_dir = ./output
; packed_dir = /path/to/data_aec/packed/train      ; or --packed-dir
; val_packed_dir = /path/to/data_aec/packed/val    ; or --val-packed-dir
;
; ⚠ STRONGLY PREFER the two-corpus form. dataset_gen/aec decides a SOURCE-
;   disjoint split (speaker / noise / room / loudspeaker) BEFORE generation and
;   writes the two corpora separately. Splitting one corpus instead -- which is
;   what the trainer falls back to -- shares talkers, rooms and devices across
;   the fence, and the validation number then partly measures memorisation.
