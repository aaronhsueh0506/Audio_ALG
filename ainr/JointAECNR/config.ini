; ============================================================
; JointAECNR -- one network for cancellation + residual suppression + noise
; reduction.  Bake-off entry #5.
;
;     in: (Y, X)   out: S_hat   target: S
;
; ⚠ Every duration here is in SECONDS and every band edge in HERTZ.  The 48 kHz
;   variant is [signal] sr = 48000 / n_fft = 1024 / win_len = 1024 /
;   hop_len = 512 and NOTHING ELSE.  If you ever find yourself editing a number
;   below to compensate for a rate change, something has hardcoded a hop and
;   the fix belongs in the code.
; ============================================================

[signal]
sr = 16000
n_fft = 512
win_len = 512
hop_len = 256
; sqrt-Hann (periodic), 50% overlap, COLA.  n_freqs (257) and frame_rate
; (62.5 fps) are DERIVED by dataset_gen/aec/aec_features.py's AecGrid; do not
; restate them here, and do not set hop_len to anything but win_len/2 -- AecGrid
; rejects it, because sqrt-Hann analysis + sqrt-Hann synthesis only sums to
; unity at 50% overlap.

center = false
; STFT centring.  ⚠ false on purpose, and the choice is load-bearing here in a
; way it is not for the NR-only models.  This trainer walks a 20-60 s sequence
; as consecutive chunks with the recurrent state carried across them; with
; center = true every chunk starts with a half-window fade-in, and the model
; would learn that taper as a reliable "a chunk began" cue that no streaming
; device ever produces.  The loss ISTFTs the prediction AND the target with the
; same setting, so the edge samples that center = false cannot reconstruct
; cancel out of the comparison (the same reasoning as GTCRN's HybridLoss).

; ============================================================
[model]
; ============================================================
enc_channels = 48
enc_stages = 4
; Frequency is halved per stage: 257 -> 129 -> 65 -> 33 -> 17.  At 48 kHz the
; same four stages give 513 -> 257 -> 129 -> 65 -> 33, so the bottleneck sees
; more frequency detail rather than a different architecture.
kernel_t = 2
kernel_f = 3
; Time kernel 2 = one frame of history per encoder stage.  The decoder's time
; kernel is fixed at 1 (see FreqUpsample): the recurrent bottleneck already
; carries temporal memory, and a time-context decoder would add a history
; buffer to every streaming state for no measured gain.

rnn_hidden = 256
rnn_layers = 2
; The bottleneck is the only unbounded-memory part of the model, and it is what
; lets a sequence's adaptation survive across chunks.  ⚠ Do not "simplify" it
; to a stack of convolutions: an echo-path change takes seconds to recover
; from, and a fixed receptive field cannot represent that.

lookahead_sec = 0.0
; Algorithmic delay the model is allowed to spend, in seconds (0.016 = one
; frame at 16 kHz/hop 256, 0.0107 at 48 kHz/hop 512 -- the same knob buys
; different frame counts, which is why it is in seconds).
; ⚠ At 0 there is no chunk-boundary artefact at all.  Above 0 the model shifts
;   its input stream forward, so the last lookahead frames of every training
;   chunk see zeros where a real stream would have the next chunk's frames.
;   That is a real (small) train/deploy mismatch: at 0.016 s and 4 s chunks it
;   is 1 frame in 249.  Raise it only when the latency budget genuinely allows.

ref_context_sec = 0.25
; How far back the reference branch may look when it fuses into the mic branch.
; ⚠ This is a DELAY SEARCH WINDOW, not a smoothing constant.  The corpus draws
;   bulk delays of 10-120 ms, so a fusion that could only align the two branches
;   at zero lag would be looking at the wrong reference frame for every clip.
;   Below ~0.12 s the model structurally cannot align the worst case.

echo_gate_memory_sec = 0.5
ref_active_floor_dbfs = -70
; The reference-activity gate: gate = p / (p + floor), where p is the maximum
; of mean|X|^2 over the last echo_gate_memory_sec.  Exactly 0 iff the far end
; has been exactly silent for that whole window, which is what makes
; "silent reference implies D_hat == 0" a structural property.
; ⚠ echo_gate_memory_sec is PHYSICS: the echo of the last sample played arrives
;   one bulk delay later (<= 0.12 s here) and then decays over the room's RT60
;   (<= 1.2 s).  Too short and the echo head is forced to zero while real echo
;   is still arriving -- it would look like a model that cannot cope with
;   reverberant rooms.  Too long only delays the idle guarantee, which is the
;   cheap direction to be wrong in.  0.5 s covers the delay plus a normal tail.

compress_exponent = 0.5
; Input feature is spec * |spec|^(exponent-1): magnitude compressed, phase kept.
; ⚠ Must map exactly 0 to exactly 0.  A log-magnitude feature does not (log 0
;   is clamped to a large negative constant) and would silently destroy the
;   zero-reference guarantee the whole design rests on.

mask_max = 2.0
; |M| = mask_max * tanh(|m|).  ⚠ Must be comfortably above 1: tanh reaches its
; bound only asymptotically, so at mask_max = 1 the identity mask -- the one the
; idle case needs -- would be unreachable and the model would always attenuate.

; ---- auxiliary heads: the reason this project is not a black box ----
aux_echo_head = true
; Predicts D_hat, supervised by the independent `echo` stem.  ⚠ Without it,
; nothing about this model is attributable: a bad score cannot be split into
; "failed to cancel" and "failed to suppress what it did not cancel", and #5
; cannot be compared against a #4 + #3 cascade at all.  It costs ~300
; parameters.  Switch it off only for a shipping build, and say so in the
; report.
echo_head_ref_gated = true
; Multiply D_hat by the reference-activity gate.  This is what upgrades "a
; silent reference should give no echo estimate" from a training hope to an
; architectural fact.  ⚠ Setting it false does not make the model worse at
; anything measured here -- it makes the hard gate unenforceable.

aux_noise_psd_head = true
; Predicts the local-noise PSD (log10 power per bin).  A joint model destroys
; the classical comfort-noise generator, which was driven by g_res; this head
; is the replacement reference a downstream CNG needs.  See postproc.py.

; ---- optional multi-frame deep filter ----
use_deep_filter = true
df_band_hz = 1500
df_span_sec = 0.048
df_lookahead_sec = 0.0
; A purely multiplicative mask cannot undo echo energy the room has smeared
; ACROSS frames.  The deep filter is a per-bin FIR over frames, applied to the
; lowest df_band_hz where that smearing costs the most speech.
; df_span_sec 0.048 = 3 taps at 16 kHz/hop 256 and 5 at 48 kHz/hop 512, i.e.
; the same 48 ms of temporal support on both grids.
; ⚠ df_lookahead_sec is a SECOND, independent source of algorithmic delay on
;   top of lookahead_sec.  The banner prints both in ms; add both to a latency
;   budget or neither.
noise_psd_eps = 1e-12

; ============================================================
[loss]
; ============================================================
; The main objective is on S_hat vs S.  Weights are relative; only their ratios
; matter.
spec_weight = 30.0
mag_weight = 70.0
; Compressed complex + compressed magnitude, the DFN/GTCRN 30/70 split, kept
; identical so the loss shape is not another axis of difference between this
; model and the NR-only entries it will be read against.
compress_gamma = 0.3
sisnr_weight = 1.0
; Waveform term.  Both spectra are ISTFT'd with the SAME settings, so the
; edge samples center = false cannot reconstruct cancel out instead of putting
; a floor under the term.

echo_weight = 5.0
; Supervision for aux_echo_head against the `echo` stem.  ⚠ Not zero, and not
; large: the echo head exists to make the model attributable, so it must be
; genuinely trained -- but if it dominates, the shared trunk starts optimising
; a diagnostic instead of the output that ships.

noise_psd_weight = 1.0
noise_psd_tau_sec = 0.2
; Target is log10 of the local-noise power smoothed with a one-pole of this
; time constant (via dataset_gen/aec's alpha_from_tau, so it means 0.2 s on
; every grid).  Raw per-frame |N|^2 is far too spiky to be a useful CNG
; reference; the smoothing is what makes the head predict a PSD rather than a
; periodogram.
noise_psd_floor_db = -90
; Frames quieter than this contribute nothing.  Without a floor the loss is
; dominated by fitting log of near-zero noise in silent bins, which is both
; numerically unstable and useless to a CNG.

idle_weight = 2.0
; Energy the echo head emits on frames where the reference has been silent
; longer than the gate memory.  ⚠ NOT vacuous even though the gate makes those
; frames structurally zero: it is evaluated on the ref-idle frames of a chunk
; whose OTHER frames are active, and the transition in and out of idle is where
; the recurrent state still says "echo is happening".  That transition is the
; part the `ref_dropout` scenario exists to supply.

; ============================================================
[training]
; ============================================================
epochs = 100
batch_size = 8
; ⚠ batch_size is the number of SEQUENCE LANES, not a count of independent
;   clips.  Lane k walks one 20-60 s sequence in order across consecutive
;   batches with its recurrent state intact (SequenceChunkSampler).  It must be
;   <= the number of sequences in the training split, or two lanes would replay
;   the same state.
lr = 1e-3
min_lr = 1e-6
lr_patience = 4
; ReduceLROnPlateau fires on the (patience + 1)-th consecutive bad epoch, so 4
; means "halve after 5 epochs without improvement".
early_stop_patience = 20
epoch_size = 0
; Maximum optimizer steps per epoch; 0 = walk the whole training split.
; ⚠ Truncating an epoch cuts sequences off mid-adaptation, so unlike the NR
;   trainers this is a compute knob, not a sampling knob -- the discarded data
;   is always the END of each lane's sequences.
grad_clip = 5.0
device = cpu
mmap = false
num_workers = 2
prefetch_factor = 2

[paths]
output_dir = ./output
; packed_dir = <directory of .pt shards from dataset_gen/aec/pack_aec_dataset.py>
;   -- override with the --packed-dir CLI argument.
