[signal]
sr = 16000
n_fft = 512
win_len = 512
hop_len = 256
; Root Hann window (COLA-compliant 50% overlap)

[model]
erb_subband_1 = 65
erb_subband_2 = 64
; ERB filterbank split: first erb_subband_1 bins kept raw,
; remaining bins mapped to erb_subband_2 ERB bands.
; Total input F = erb_subband_1 + erb_subband_2 = 129.
; DPGRNN width = 33 (derived automatically from encoder strides).

[training]
epochs = 100
batch_size = 16
; GTCRN paper §3.2 uses batch 16 for DNS3.
; (An earlier comment here claimed batch_size >= 2 was required for
;  BatchNorm2d.  That is false: BatchNorm2d normalises over (N, H, W), so a
;  batch of 1 still has T*F values per channel.  Verified by running a
;  forward+backward at batch=1.)
lr = 1e-3
min_lr = 1e-6
lr_patience = 4
; ReduceLROnPlateau fires on the (patience + 1)-th consecutive bad epoch, so 4
; is what "halve the LR after 5 epochs without improvement" actually means.
; This was 5, which waited for 6.  Do not "correct" it back.
; GTCRN paper §3.2: "Adam Optimizer with an initial learning rate of 0.001.
; The learning rate will be halved if the validation loss does not decrease
; for 5 consecutive epochs."  (Previously AdamW(wd=0.05) + cosine warmup,
; which is neither the paper's optimizer nor its schedule.)
early_stop_patience = 20
epoch_size = 40000
; GTCRN paper §3.2: "40,000 noisy-clean pairs are randomly selected for each
; epoch" (DNS3).  0 = use all training samples per epoch.
; Capped at len(train_set), so a smaller corpus falls back to "use all".
; ⚠ RNNoise-ERB must use the SAME per-epoch sample count, otherwise
;   "100 epochs" means two different amounts of gradient and the two models
;   are not comparable.
device = cuda
mmap_block_size = 256
; --mmap 時以區塊為單位 shuffle，避免大型 shard 的隨機 page fault
mmap_num_workers = 2
prefetch_factor = 2
; shared server 的低 RAM 預設；可依儲存裝置與 CPU 再微調

[paths]
output_dir = ./output
; packed_dir = /path/to/data   ; override with --packed-dir CLI arg
