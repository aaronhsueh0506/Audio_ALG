[signal]
sr = 16000
n_fft = 512
win_len = 512
hop_len = 256
; Root Hann window (COLA-compliant 50% overlap)

[model]
erb_subband_1 = 65
erb_subband_2 = 64
; ERB filterbank split: first erb_subband_1 bins kept raw,
; remaining bins mapped to erb_subband_2 ERB bands.
; Total input F = erb_subband_1 + erb_subband_2 = 129.
; DPGRNN width = 33 (derived automatically from encoder strides).

[training]
epochs = 100
batch_size = 32
; batch_size >= 2 required (BatchNorm2d in GTCRN)
lr = 1e-3
min_lr = 1e-6
warmup_epochs = 3
weight_decay = 0.05
early_stop_patience = 20
epoch_size = 0
; 0 = use all training samples per epoch
device = cuda
mmap_block_size = 256
; --mmap 時以區塊為單位 shuffle，避免大型 shard 的隨機 page fault
mmap_num_workers = 2
prefetch_factor = 2
; shared server 的低 RAM 預設；可依儲存裝置與 CPU 再微調

[paths]
output_dir = ./output
; packed_dir = /path/to/data   ; override with --packed-dir CLI arg
