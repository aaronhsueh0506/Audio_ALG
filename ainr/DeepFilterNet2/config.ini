[signal]
sr = 48000
n_fft = 960
win_len = 960
hop_len = 480
; 48 kHz full-band (matches DeepFilterNet / the Keras reference); 20ms/10ms frames

[model]
n_erb = 32
; Number of ERB bands for the ERB path encoder/decoder
df_bins = 96
; Number of low-frequency bins processed by the deep-filter decoder (48k: 0-4.8kHz, DFN nb_df)
df_order = 5
; FIR filter order (context window) for deep filter (causal, no future frames)
emb_size = 256
enc_channels = 16
gru_groups = 1
; Default gru_groups=1 (standard GRU); matches DFN2 default

[training]
epochs = 100
batch_size = 16
; smaller than GTCRN due to DF context buffer memory
lr = 1e-3
min_lr = 1e-6
warmup_epochs = 3
weight_decay = 0.05
early_stop_patience = 20
epoch_size = 0
device = cuda

[perceptual_loss]
fft_sizes = 960,480,1920
gamma = 0.3
; Compressed magnitude exponent (spectral convergence)

[paths]
output_dir = ./output
; packed_dir = /path/to/data   ; override with --packed-dir CLI arg

[inference]
pf_beta = 0.0
; Valin post-filter strength on ERB mask (0.0 = disabled)
