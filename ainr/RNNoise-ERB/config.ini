[signal]
sr = 16000
n_fft = 512
; win_len 和 hop_len 為 optional:
;   win_len 預設 = n_fft
;   hop_len 預設 = win_len // 2 (50% overlap → root Hann COLA 完美重建)
; 當 win_len < n_fft 時，自動 zero-pad 到 n_fft 做 FFT
; 取消註解可自訂:
; win_len = 320
; hop_len = 160
; --- Hybrid bands (ref: GTCRN) ---
; hybrid_cutoff_hz > 0 時啟用: cutoff 以下用原始 FFT bins, 以上用 ERB bands
; n_bands 由 hybrid 計算自動決定 (cutoff_bin + n_erb_high_bands)
; 設 hybrid_cutoff_hz = 0 時退回純 ERB 模式，使用 n_bands
hybrid_cutoff_hz = 0
n_erb_high_bands = 0
; hybrid 暫時關閉，使用純 ERB 模式 (n_bands = 32)
n_bands = 22
; (純 ERB fallback, hybrid 模式下此值被忽略)
lookahead_frames = 1
; 往後看幾個 frame (0 = causal, 1 = 1-frame lookahead)
; conv1 k=3 + lookahead=1 = 置中 3-tap (1 過去 + 當前 + 1 未來), 延遲 = 1 hop ≈ 16ms (16k/hop256)
; lookahead=1 會增加 hop_len 的延遲，但對 transient (e.g. 引擎轉速上升) 有幫助
; 訓練和推論必須使用相同設定 (改此值需重訓; 舊 lookahead=0 checkpoint 不相容)

[feature]
version = log_erb_dfn_mean_cplx_unit_0_4k_v3
; DeepFilterNet 原作者 libDF band_mean_norm_erb:
;   mean = alpha*mean + (1-alpha)*erb_db; feature=(erb_db-mean)/40.
; 不另外加 absolute-level input；complex 路徑仍保留部分 level 資訊。
; alpha 依原作者 calc_norm_alpha 從小數第 3 位開始四捨五入；
; 在 16 kHz / hop 256 / tau 1 s 為 0.984，並固定於 process.h。
erb_norm_tau_sec = 1.0
erb_norm_init_lo_db = -60.0
erb_norm_init_hi_db = -90.0
erb_norm_scale_db = 40.0
erb_norm_clip = 5.0
; Complex branch 取 0..4kHz（512 FFT @ 16kHz = 129 bins）。
spec_max_hz = 4000
; DeepFilterNet 原作者 libDF band_unit_norm: 每個 complex bin 用自己的
; magnitude 更新 EMA state，再以 sqrt(state) 正規化 real/imag。
spec_norm_tau_sec = 1.0
spec_norm_init_lo = 0.001
spec_norm_init_hi = 0.0001
spec_norm_eps = 1e-12
spec_clip = 10.0
; 這些常數也固定在 process.h；修改需同步 C 並重訓。

[paths]
output_dir = ./output

[model]
; RNNoise 容量 (官方 v0.2 = cond_size 128 / gru_size 256)。
; ERB temporal conv 與 complex frequency encoder 先各自編碼，再 fusion 到 gru_size。
; 3 層 GRU 皆 gru_size。改這裡 train + denoise 自動同步 (存進 ckpt)。
cond_size = 64
gru_size = 128
spec_conv_channels = 8
spec_embed_size = 64

[training]
epochs = 100
batch_size = 128
lr = 3e-4
device = cuda
epoch_size = 0
; 每 epoch 隨機抽取的 sample 數 (0 = 全部跑完)
mmap_block_size = 256
; --mmap 時以區塊為單位 shuffle，避免大型 shard 的隨機 page fault
mmap_num_workers = 2
prefetch_factor = 2
; shared server 的低 RAM 預設；可依儲存裝置與 CPU 再微調
dropout = 0.05
; GRU 層間 dropout
weight_decay = 1e-12
; AdamW weight decay 起始值。DFN 用 1e-12 (≈0) 起步
weight_decay_end = 0.01
; DFN-style wd 排程: cosine 從 weight_decay → weight_decay_end (DFN3=0.01, DFN2=0.05)。
;   設 -1 = 關閉排程, 用常數 weight_decay。⚠ 有效衰減=lr·wd, 全程極小 (DFN 實質幾乎不正規化)
min_lr = 1e-6
; cosine annealing 最小 lr (eta_min)
warmup_epochs = 3
; linear warmup epochs (DFN2 default = 3)
early_stop_patience = 20
; val loss 連續 N epochs 沒改善就停訓

[multi_res_spec_loss]
; DeepFilterNet 3 production MultiResSpecLoss；這是唯一訓練 objective。
fft_sizes = 256, 512, 1024, 2048
gamma = 0.3
; magnitude 與 complex spectrum 都先做 |X|^gamma compression 再算 MSE。
factor = 500
factor_complex = 500
; 同原作 production config：四個 resolution 直接加總，不取平均。
; 沒有 ERB IRM、speech-activity/VAD 或 pure-noise 特別加權。
