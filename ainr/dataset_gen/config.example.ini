; ============================================================
; AINR dataset generation config
;
; This file only configures gen_dataset.py / DNS4Dataset WAV-pair generation.
; Model architecture, FFT/ERB features, optimizer, training, and loss settings
; belong in each downstream model's own config and intentionally do not appear
; here.
; ============================================================

[signal]
; 每次只產生一種 sample rate。gen_dataset.py 未傳 --sample-rate 時使用此值；
; CLI 可覆寫。RNNoise-ERB/GTCRN 設 16000，DeepFilterNet2 設 48000。
sr = 48000

[paths]
speech_dir = /path/to/dns4/clean_speech
noise_dir = /path/to/dns4/noise
rir_dir = /path/to/dns4/impulse_responses
; (output location is NOT configured here — gen_dataset.py --output, default "data")

[audio]
segment_sec = 3.0

[gen]
start_idx = 0
; gen_dataset 起始檔名索引, 擴增現有 dataset (不洗掉舊檔) 時設成目前已存 sample 數
; 例: 已 gen 30000 → 想再加 25hr → 設 start_idx=30000, --hours 25, 檔名從 030000.wav 開始
; 注意: 為避免擴增時產生與既有檔案完全相同的資料, effective_seed = seed + start_idx
;       所以 start_idx > 0 時 augmentation 自動走不同隨機流, 不會跟 0..start_idx-1 重複
seed = -1
; -1 = 每次啟動從 OS 取得新的 random seed（預設，實際 seed 會印出並寫入 meta.json）
; >= 0 = 固定 seed，可重現同一次設定/環境下的 dataset；CLI --seed 優先。
; Optional: limit the number of speech files considered in each shuffled pass.
; 0 (default when omitted) = use every speech file.
; pass_size = 0

[mixing]
; DeepFilterNet2/3 的離散 SNR 值；mixed samples 會等機率抽一個值。
; DFN3 config 另外用 -100 sentinel 代表 pure noise；本生成器改用下方
; noise_only_p 明確控制，不把 -100 混入一般 SNR。
; 與 DeepFilterNet mix_audio_signal 相同，SNR 以 clean target RMS 為基準，
; mixture 中則放入 full-RIR reverberant speech。
snr_values = -5, 0, 5, 10, 20, 40
target_rms_min = -35
target_rms_max = -15
; dBFS

[rir]
p_rir = 0.1
; 套用 RIR 機率 (DFN3 production = 0.1)
rt60_min = 0.2
rt60_max = 1.0
; 秒, Schroeder 積分法估算 (DFN3 sampler 範圍)
early_rir_ms = 20.0
; late offset (ms): peak + 此值之內 target 保留, 之後依 RT60 指數衰減 (DFN3 風格)
pre_delay_keep_ms = 1.0
; peak 前保留的 delay (ms)
drr = 0.3
; DeepFilterNet with_drr 的 0..1 線性 blend factor（不是 dB）:
; target = drr · dry + (1-drr) · early_reverb_speech，原作者預設 0.3。
; dry 會先 delay 到 trimmed RIR 的 direct-path peak，避免 target/noisy 時間錯位。

[noise]
max_noise_mix = 1
; DFN3 沒做多噪音混合 (p_interfer_sp=0)
noise_only_p = 0.05
; 純噪音樣本機率：noisy=noise, target=silence。
speech_only_p = 0.05
; 純語音 identity 樣本機率：noisy=target，避免模型沒看過真正無噪輸入。
; noise_only / speech_only 互斥；其餘 90% 才從 snr_values 取樣混噪。

[augmentation]
; --- RandBiquadFilter (ref: DeepFilterNet) ---
; 分別套用在 speech 和 noise (混合前, 獨立隨機參數)
p_biquad = 0.5
n_biquad_filters = 3
; 每次最多幾個 biquad filter
biquad_gain_db = 15.0
; ±gain 範圍 (dB)
biquad_q_min = 0.5
biquad_q_max = 1.5
; 6 種 type: LowPass, HighPass, LowShelf, HighShelf, PeakingEQ, Notch
; 頻率範圍依 type:
;   LowPass 4-8kHz, HighPass 40-400Hz, LowShelf 40-1000Hz,
;   HighShelf 1-8kHz, PeakingEQ 40-4000Hz, Notch 40-4000Hz

; --- Lower-rate source upsample simulation ---
; 模擬實際音源原本是較低 SR，為了送進 16/48 kHz 演算法才 upsample。
; noisy 與 target 走完全相同的 downsample→upsample，不做 bandwidth extension。
p_resample = 0.2
; 套用機率；請依部署端低 SR 音源的實際比例調整。
source_sr_values = 8000, 12000, 16000, 22050, 24000, 32000, 44100
; 只會從小於 [signal] sr 的離散值抽樣：
;   algorithm sr=48000 → 使用完整列表
;   algorithm sr=16000 → 自動只保留 8000, 12000

; --- Clipping Distortion ---
; 只套用在 noisy (distortion, target 不變)
p_clipping = 0.0
; DFN3 production p_clipping = 0
clip_snr_min = 0
clip_snr_max = 20
