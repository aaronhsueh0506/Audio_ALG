; ============================================================
; PostFilter -- joint residual-echo + noise suppressor (stage 3)
;
;   in : (E, D_hat[, X])   E = AEC output, D_hat = echo estimate, X = reference
;   out: G(f) in [0,1]     (or a bounded complex mask; see [model] output_type)
;   target: S              near-end speech, room reverberation included
;
; This block OWNS the suppression decision.  There is no classical residual-echo
; suppressor downstream and no min(g_nr, g_res) fusion, so anything this model
; declines to suppress ships.
;
; ⚠ The preset gain floor and the attenuation cap are NOT in here as model
;   parameters -- they belong to the CALLER and live in [inference], which
;   denoise.py reads and postproc.py applies AFTER the network.  Folding them
;   into the network would make the floor untunable per product without
;   retraining.
; ============================================================

[signal]
; Must match the packed corpus.  AecGrid derives n_freqs and frame_rate; do not
; restate them anywhere.
sr = 16000
n_fft = 512
win_len = 512
hop_len = 256
; sqrt-Hann (periodic), 50% overlap, COLA.
; The 48 kHz variant is sr = 48000 / n_fft = 1024 / win_len = 1024 / hop_len =
; 512 and NOTHING ELSE.  Every time constant below is in SECONDS and goes
; through alpha_from_tau, so none of them needs touching.
; ⚠ hop_len MUST be win_len/2; AecGrid rejects anything else.

; ============================================================
; The front-end this model is being trained against
; ============================================================
;
; ⚠ THE LOAD-BEARING SETTING.  (E, D_hat) come from a FROZEN upstream stage, and
;   the residual distribution differs substantially between a classical linear
;   canceller and a learned one: convergence speed, musical noise, nonlinear
;   echo left over, phase error, near-end leakage, path-change transients.
;   The trainer records frontend_id in the checkpoint and REFUSES to resume
;   against a different front-end unless --allow-frontend-change is passed.
;   Attaching a checkpoint to a front-end it was not trained on is a valid OOD
;   experiment; it is NOT a comparable result, and the checkpoint keeps a
;   permanent frontend_history so the two can never be confused later.
[frontend]
kind = stft_nlms
; none       -- D_hat = 0, E = Y.  The pure-noise-suppression ablation; also the
;               only configuration in which this project is comparable to the
;               NR bake-off models.
; oracle     -- D_hat = D (the true echo), so R = 0.  ⚠ A DIAGNOSTIC UPPER
;               BOUND, not a result.  Any number from it must say "oracle AEC".
; stft_nlms  -- a real per-bin multi-tap NLMS canceller running on this grid.
;               Stateful, converges, mis-converges on double talk, and has to
;               re-converge after an echo-path change -- i.e. it produces the
;               residual distribution a classical front-end actually produces.
; plugin     -- import a stage-1 model (e.g. the AECNet sibling project) via
;               [frontend] plugin / checkpoint below.

randomize = true
; ⚠ FRONT-END DOMAIN RANDOMISATION.  Draws a fresh (filter span, step size) per
;   lane at every SEQUENCE boundary, so the postfilter sees many front-end
;   behaviours instead of one.
; ⚠ This replaced a design that pinned the postfilter to one front-end and
;   refused to resume across a change.  That design was backwards.  The
;   controlled experiment (Panchapagesan et al., Interspeech 2023) holds the
;   DEPLOYED canceller fixed and changes only the canceller used to make the
;   TRAINING data: WER swings 17-30% relative, and filter order 1 vs 4 alone
;   accounts for most of it.  Their conclusion is that matching the strong
;   deployed filter "likely results in overfitting" and that training against a
;   WEAKER, higher-residual, worse-aligned front-end generalises better.
;   Seidel et al. (ICASSP 2024) independently randomise LEC filter length and
;   smoothing for the same reason.
; ⚠ Corollary, and it constrains [feature]: do not condition the model on
;   front-end INTERNAL state (tap counts, convergence flags). One model serving
;   both a classical and a learned canceller is only possible if it reads
;   signals, not the canceller's private variables.
; ⚠ Redrawn at sequence boundaries only.  Mid-sequence redraw would look like
;   the canceller being reconfigured underneath the model, which no real system
;   does.
randomize_span_sec = 0.064,0.128,0.256,0.512
; The span pool, in SECONDS.  0.064 s is deliberately SHORTER than the corpus's
; 120 ms bulk delay: that lane's canceller genuinely cannot reach the echo, which
; is the "front-end failed" condition the postfilter must survive rather than a
; misconfiguration.  ⚠ Do not delete the short entries to make the numbers look
; better -- that is exactly the overfitting the randomisation exists to prevent.
randomize_mu_min = 0.1
randomize_mu_max = 0.7
; Step-size pool. Low = slow, chronically unconverged; high = fast and
; mis-converging hard on double talk. Both are real deployments.

filter_span_sec = 0.256
; stft_nlms only: echo-path coverage in SECONDS.  Converted to whole filter
; taps by dataset_gen.aec.frames_from_seconds, so 0.256 s is 16 taps at
; 16 kHz/hop 256 and 24 taps at 48 kHz/hop 512 -- the same acoustic span on
; both grids, with no config edit.
; ⚠ Must exceed bulk_delay_ms_max (120 ms in the generator config) plus the
;   room RIR, or the canceller cannot reach the echo at all and every residual
;   in the corpus is "unconverged" rather than "converged imperfectly".
; ⚠ Never state this in taps.  "16" silently buys 256 ms at 16 kHz but only
;   171 ms at 48 kHz, which lands under the bulk delay plus RIR and turns the
;   whole corpus into unreachable echo -- a front-end that looks broken rather
;   than a config that is wrong.  test_contract.py pins the millisecond span.
mu = 0.35
; NLMS step size.  Higher tracks faster and mis-converges harder on double talk;
; 0.35 is the usual robust compromise.  It is part of frontend_id, so changing
; it invalidates a resume exactly as a different front-end would.
leak = 0.9999
; Per-frame coefficient leak.  Bounds the filter norm so a long double-talk
; stretch cannot leave the filter permanently blown up.  ⚠ At 1.0 the corpus's
; 60 s sequences do occasionally diverge.
far_active_db = -60
; Adaptation freezes when the reference band power is this far below its own
; long-term peak.  Without the gate, ref_dropout chunks (X == 0) drive the
; update with pure near-end speech and unlearn the filter -- which would make
; the idle-loss data teach the WRONG lesson.

plugin =
; 'package.module:factory' for kind = plugin.  The factory is called as
;   factory(checkpoint=<path>, grid=<AecGrid>, device=<torch.device>)
; and must return an object exposing .frontend_id, .init_state, .reset_lanes
; and .process with the same signature as frontends.FrozenFrontEnd.
checkpoint =
; Stage-1 checkpoint path for kind = plugin.  Its content hash goes into
; frontend_id, so two different AECNet checkpoints are two different
; front-ends as far as the resume gate is concerned.  ⚠ That is deliberate:
; "the same architecture, retrained" is a different residual distribution.

; ============================================================
; Features
; ============================================================
;
; ⚠ SCALE INVARIANCE IS THE DESIGN CONSTRAINT, not a nicety.  Every channel is a
;   ratio or a log-domain difference, computed after E, D_hat and Y have been
;   divided by sqrt(mean(|E|^2 + |D_hat|^2)) of the SAME frame.  Multiply the
;   whole front-end output by any constant and the features are unchanged, so an
;   upstream gain retune -- or swapping a classical canceller for a learned one
;   with different output scaling -- does not move the input distribution.
;   tests/test_model.py asserts this with a real tolerance.
[feature]
n_bands = 32
; ERB bands for band-gain regression.  Only used when [model] mask_resolution =
; band; at 'full' the features are per-bin and this is ignored.
use_reference = true
; Adds log|X| band energy (normalised by X's OWN frame energy -- the far-end
; gain is independent of the mic path) and the E/X coherence.
; ⚠ Worth its two channels because a LINEAR front-end's D_hat cannot contain
;   the loudspeaker's nonlinear products, and those are exactly what survives
;   into the residual.  Set false only to prove that dependence.
coherence_tau_sec = 0.06
; Time constant of the EMA behind the banded E/D_hat coherence -- the primary
; residual-echo cue.  60 ms is short enough to follow a double-talk onset and
; long enough that a single frame of noise does not swing it.
level_tau_sec = 1.0
; Time constant of the temporal-contrast channel (band log-energy minus its own
; running mean).  This is what distinguishes stationary noise from speech
; WITHOUT reference to an absolute level.
use_mic = true
; Adds the microphone's OWN band spectrum log|Y| (Y = E + D_hat), on top of its
; existing role as the denominator of the E/Y ratio.
; ⚠ This is the ONE side-input both camps in the literature agree on.  Franzen &
;   Fingscheidt (ICASSP 2022) ran the only exhaustive sweep for this block: Y
;   added to E lifts noise-only dSNR from 14.74 to 22.38 dB, and their winning
;   input set is {Y, D_hat, E}.  Their stated reason is that Y is UNPROCESSED BY
;   THE AEC -- its noise has not been distorted by the adaptive filter -- which
;   a ratio against Y discards, since a ratio keeps the relationship and throws
;   away the shape.  Set false only to reproduce the ratio-only variant.

include_absolute_level = true
; Adds log10 of the frame's absolute energy -- the one channel that is NOT
; scale-invariant.
; ⚠ THE DEFAULT CHANGED FROM false TO true, and the reason is evidence, not
;   taste.  Scale-invariant ratio INPUTS are this project's hypothesis, not an
;   established practice: a survey of twelve published residual-echo suppressors
;   found the dominant convention is raw compressed/log spectra with either no
;   normalisation or a FIXED ABSOLUTE scale.  The only published precedent for
;   ratio inputs never justifies the choice and never tests front-end
;   portability.  The strongest counter-evidence is that the one shipped
;   production neural residual-echo estimator hard-codes an absolute scale (a
;   1/32768 constant, commented "Trained model expects [-1,1]-scaled signals")
;   and feeds raw power spectra -- no ratio, no per-frame normalisation.
; ⚠ Where ratios genuinely ARE universal is the OUTPUT side: the mask multiplies
;   E and the usual targets (IRM/IAM/PSM) are themselves ratios, which already
;   buys most of the front-end-scale robustness for free.
; ⚠ So the design is now ratios ALONGSIDE an absolute channel, not instead of
;   one.  Setting this false gives the pure-ratio variant, which is the
;   genuinely interesting experiment -- nobody has published it -- and the
;   scale-invariance test asserts the property holds in exactly that mode.

; ============================================================
; Model
; ============================================================
[model]
mask_resolution = band
; band -- predict n_bands gains and expand through the ERB partition of unity.
;         The low-complexity reference point, and what the published low-MACs
;         hybrids do.
; full -- predict one gain per FFT bin.  Features become per-bin too, so this is
;         a genuinely higher-resolution model, not a band model with an
;         interpolated output.  ~2.5x the MACs.
output_type = gain
; gain    -- real G in [0,1].  The default and the shipping form.
; complex -- G * exp(j*theta), |mask| still in [0,1].  ⚠ Requires
;            mask_resolution = full: phase varies far too fast across an ERB
;            band for one rotation per band to mean anything, and the trainer
;            refuses the combination rather than letting it quietly underperform.
enc_channels = 48
enc_kernel_t = 3
enc_kernel_f = 3
enc_downsamples = auto
; 'auto' halves the frequency axis until it is <= 33 wide, with a floor of 2
; halvings.  32 bands -> 8; 257 bins -> 33.  An integer overrides it.
gru_hidden = 352
gru_layers = 2
dec_hidden = 128
lookahead_sec = 0.0
; Algorithmic latency the encoder is allowed to buy, in SECONDS.  0 = strictly
; causal.  Converted to whole frames on this grid, so the same value costs the
; same milliseconds at 16 and 48 kHz.  One frame is 16 ms here, so even 0.016
; is a real product decision, not a free accuracy win.

; ============================================================
; Loss.  Target is S (near speech WITH its room reverberation -- the near
; talker's reverberation is desired signal, not a dereverberation target).
; ============================================================
[loss]
gamma = 0.3
; Magnitude compression.  Compression is what makes low-level residual echo
; visible to an MSE at all; at gamma = 1 the loss is dominated by speech peaks
; and residual echo 30 dB down contributes nothing.
mag_weight = 500
complex_weight = 500
sisdr_weight = 1.0
; SI-SDR is computed between the ISTFT of the PREDICTED spectrum and the ISTFT
; of the TARGET spectrum -- never against the raw waveform.  Comparing against
; the raw waveform puts a WOLA edge-reconstruction floor on the term that the
; model can never reach (the mistake GTCRN's loss carried for a while).
echo_leak_weight = 0.0
; ⚠ Optional penalty on |mask * R| where R = D - D_hat, computable in training
;   because the corpus ships D separately.  R IS NOT A TARGET; this term only
;   moves the operating point along the echo/near-end Pareto curve, it does not
;   improve it.  Raising it buys echo suppression with near-end damage.  Report
;   the value used alongside any echo number.
idle_weight = 3.0
; Loss multiplier on chunks where the far end is silent (ref_dropout, near_only)
; -- the case where any suppression at all is pure regression.  Those chunks are
; only ~2.5% + ~12% of the corpus, so at weight 1.0 the gradient from them is
; statistically invisible next to the echo cases.
; ⚠ This reweights the corpus.  It does not change what the loss means, but two
;   runs with different idle_weight are not the same experiment.
dt_weight = 1.0
; Same mechanism for double_talk chunks.  1.0 = no reweighting; the knob exists
; because near-end preservation under double talk is the property that is
; hardest to buy back after the fact.

; ============================================================
; Training
; ============================================================
[training]
epochs = 100
lanes = 16
; Batch width.  ⚠ Not "batch_size": every lane carries ONE sequence and walks
; its chunks in order, so lane k of batch b+1 is the continuation of lane k of
; batch b.  Recurrent state, feature EMA state and the front-end's adaptive
; filter all persist along a lane.  Resetting them every chunk would hide
; convergence, echo-path-change recovery and long-term drift -- the three things
; the 20-60 s sequences exist to expose.
lr = 1e-3
min_lr = 1e-6
lr_patience = 4
; ReduceLROnPlateau fires on the (patience + 1)-th consecutive bad epoch, so 4
; means "halve after 5 epochs without improvement".
early_stop_patience = 20
grad_clip = 5.0
epoch_size = 0
; Chunks per epoch, rounded down to whole batches.  0 = walk every chunk once.
; ⚠ Truncating an epoch cuts every lane mid-sequence; the next epoch reshuffles,
;   so no sequence is systematically starved, but a short epoch_size means few
;   sequences are ever seen to the end.
device = cuda
num_workers = 2
prefetch_factor = 2
val_fraction = 0.1
; Only used when the corpus carries no source-disjoint split of its own.  ⚠ The
; split is then made over SEQUENCES, never over chunks: a chunk-level split puts
; the same speaker, room and echo path on both sides and the validation curve
; becomes a memorisation curve.

[paths]
output_dir = ./output
; packed_dir = /path/to/packed_aec   ; override with --packed-dir
; val_packed_dir =                   ; optional; a separately generated --split val

; ============================================================
; Caller-side post-processing.  denoise.py IS the caller, so it applies these;
; the network never sees them.
; ============================================================
[inference]
gain_floor_db = -25
; The preset floor, in the same 4-level family the classical NR ships
; (-20 / -25 / -30 / -40).  ⚠ dB on a GAIN, so /20, not /10.
attenuation_cap_db = 0
; "Never attenuate by more than this many dB."  0 disables it.  It is the same
; clamp as gain_floor_db seen from the other side and postproc applies whichever
; is less aggressive; both exist because they are configured from different
; places -- the floor from the tuning preset, the cap from a product decision.
attack_tau_sec = 0.0
release_tau_sec = 0.0
; One-pole smoothing of the gain, in SECONDS.  0/0 = no smoothing.  Attack is
; the direction where the gain FALLS.  ⚠ Slowing the attack trades echo leakage
; at onsets for fewer gain-modulation artefacts; it cannot improve both.
